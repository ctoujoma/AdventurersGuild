# Encargos del tablón (data/quests.ts). Huecos: {place} el lugar (ya con artículo: «el molino»),
# {threat} la amenaza (con artículo: «un oso»); {Threat} es la amenaza con mayúscula.
# Los textos dicen «en {place}» o «cerca de {place}», nunca «el molino de {place}».
# clientes: «etiqueta» es lo que sale en el tablón; «prosa», cómo se le nombra en una frase.

plantillas:
  Cazar:
    titulos:
      - "{amenaza, mayus} en {lugar}"
      - "La bestia de {lugar}"
      - "Cazar {amenaza}"
      - "Recompensa por {amenaza}"
      - "Algo baja del monte"
    textos:
      - "Desde la luna nueva, {amenaza} baja hasta {lugar} y ya no queda una gallina viva."
      - "Los vecinos hablan de algo «grande, apestoso y con muy malas pulgas». Es {amenaza}, y anda por {lugar}."
      - "Cerca de {lugar} los pastores no pegan ojo. {amenaza, mayus}, en cambio, duerme de día, y es cuando hay que ir."
      - "Se paga por la cabeza de {amenaza}, que ronda {lugar}. De momento nadie ha cobrado."
      - "Junto a {lugar} hay huellas del tamaño de un escudo. Desde entonces nadie sale de casa después de cenar."
      - "{amenaza, mayus} se ha llevado dos ovejas y el perro que las cuidaba. Cerca de {lugar} quieren su piel colgada en la plaza."
      - "Un cazador fue tras {amenaza} camino de {lugar}. Han vuelto sus botas; él no."
      - "Cerca de {lugar} cierran las puertas al anochecer por culpa de {amenaza}. La feria se hace igual, pero de día."
    historias:
      - - "El ternero que faltaba"
        - "Hace tres noches que algo ronda cerca de {lugar}. Esta mañana faltaba un ternero. Es {amenaza}."
      - - "Pieles para el curtidor"
        - "El curtidor paga bien por la piel de {amenaza}, entera y sin agujeros de más. Ronda por {lugar}."
      - - "Sangre en el abrevadero"
        - "El abrevadero junto a {lugar} amaneció rojo. Las huellas van hacia el monte, y son de {amenaza}."
    amenazas:
      - "un huargo tuerto"
      - "un oso con mal genio"
      - "un jabalí del tamaño de un carro"
      - "una manada de lobos"
      - "un grifo joven"
      - "un trol de puente"
      - "un oso pardo con una flecha clavada"
      - "una pareja de wargos"
      - "una serpiente de ciénaga"
  Escoltar:
    titulos:
      - "Escoltar la carreta hasta {lugar}"
      - "El camino de {lugar}"
      - "Un carro, tres baúles y {lugar}"
      - "Hasta {lugar} sin un rasguño"
    textos:
      - "Hay que llevar una carga hasta {lugar}. Los dos últimos carros no llegaron."
      - "Un mercader con prisa y poca fe en los caminos quiere llegar entero a {lugar}."
      - "En el camino de {lugar} asaltan carros, y dicen que son {amenaza}. La carga tiene que llegar."
      - "Tres carros de sal salen hacia {lugar} al alba. El año pasado se perdieron por culpa de {amenaza}."
      - "Un peregrino rico quiere ir a rezar a {lugar}. Reza mucho, pero se fía más de las espadas."
    historias:
      - - "El recaudador"
        - "Un recaudador tiene que llegar a {lugar} con la bolsa llena. En el camino nadie lo quiere vivo."
      - - "Una boda en {lugar}"
        - "Una novia viaja a {lugar} con su ajuar y una tía que no se calla. Lo segundo no tiene arreglo."
      - - "Un ataúd camino de {lugar}"
        - "Hay que llevar un ataúd hasta {lugar} sin abrirlo. El que paga insiste mucho en lo de no abrirlo."
      - - "El vino del obispo"
        - "Doce barricas para el obispo, que espera en {lugar}. Si llega una menos, se notará en el sermón."
    amenazas:
      - "unos bandidos"
      - "unos salteadores"
      - "los hermanos Cardo"
      - "una banda de trasgos"
      - "unos desertores"
      - "una partida de orcos"
      - "unos cobradores de peaje que nadie ha puesto"
      - "los de la Mano Negra"
  Explorar:
    titulos:
      - "Las ruinas de {lugar}"
      - "Lo que hay bajo {lugar}"
      - "Cartografiar {lugar}"
      - "Más allá de {lugar}"
    textos:
      - "Nadie ha vuelto de {lugar} con un mapa. Algunos han vuelto sin botas."
      - "Un erudito paga por saber qué queda en {lugar}. Él, por supuesto, se queda en casa."
      - "Bajo {lugar} hay túneles, y en los túneles, según dicen, {amenaza}."
      - "El conde quiere saber si se puede abrir un camino por {lugar}. Si no se puede, también quiere saberlo, pero paga menos."
      - "Los niños juran que cerca de {lugar} hay una puerta en la roca. Los mayores dicen que no, pero no se acercan."
    historias:
      - - "La grieta"
        - "Tras el último temblor se abrió una grieta cerca de {lugar}. Del fondo sale aire caliente; dicen que abajo hay {amenaza}."
      - - "Un mapa a medias"
        - "Un mapa viejo marca una cruz en {lugar}. El que lo vendió juró que era auténtico y se fue muy deprisa."
      - - "El pozo seco"
        - "Un pozo junto a {lugar} se secó en una noche. El pocero bajó con una vela y vio una escalera que nadie recordaba."
      - - "La torre hundida"
        - "Con la sequía ha asomado una torre en la laguna, cerca de {lugar}. Hace cien años no estaba en ningún mapa."
    amenazas:
      - "arañas"
      - "algo que se arrastra"
      - "algo que imita voces"
      - "un antiguo guardián"
      - "murciélagos del tamaño de un perro"
      - "un ermitaño que no quiere visitas"
      - "gases que marean"
      - "una cripta sellada"
  Recuperar:
    titulos:
      - "Lo que se dejaron en {lugar}"
      - "Un encargo discreto en {lugar}"
      - "Sacarlo de {lugar}"
    textos:
      - "El objeto está en {lugar}, custodiado por {amenaza}. El cliente jura que le pertenece."
      - "Cerca de {lugar}, en una casa cerrada, hay un libro de cuentas que alguien prefiere quemado. El cliente lo prefiere en sus manos."
      - "Algo que no es tuyo espera en {lugar}, vigilado por {amenaza}. El cliente no da más detalles."
    historias:
      - - "Una caja en {lugar}"
        - "Hay que sacar una caja de una casa vacía en {lugar} sin preguntar qué lleva. Mitad por adelantado."
      - - "El anillo de la abuela"
        - "Hay que recuperar un recuerdo de familia de {lugar}. La familia no es muy de fiar."
      - - "El sello del notario"
        - "Al notario le robaron el sello, y el ladrón se esconde en {lugar}. Sin sello no hay herencias, y sin herencias hay muchos primos enfadados."
      - - "Las joyas de la viuda"
        - "Una viuda quiere sus joyas antes de que las vendan en la feria. Están en {lugar}; sabe quién las tiene, pero no lo dice en voz alta."
      - - "La campana robada"
        - "Se llevaron la campana de la ermita una noche sin luna. Pesa como un buey, así que no ha podido pasar de {lugar}."
      - - "Lo que el río dejó en {lugar}"
        - "La riada arrastró un cofre hasta {lugar}. El dueño lo quiere de vuelta y no pregunta cómo."
    amenazas:
      - "unos guardias aburridos"
      - "unas trampas antiguas"
      - "un perro enorme"
      - "un cerrojo enano"
      - "un ladrón muy celoso de lo suyo"
      - "una familia de osos"
      - "unos contrabandistas"
      - "un gato que no es solo un gato"
  Investigar:
    titulos:
      - "Lo que suena en {lugar}"
      - "El fantasma de {lugar}"
      - "Algo raro en {lugar}"
      - "Lo que pasa en {lugar}"
    textos:
      - "Desde hace una semana suenan campanas en {lugar}. En {lugar} no hay campanas."
      - "«No es que dé miedo, es que no paga». Una posadera cerca de {lugar} tiene un huésped muerto."
      - "Cerca de {lugar} enterraron a un herrero el martes. El jueves estaba otra vez en su fragua. Dicen que es {amenaza}."
      - "Un pozo junto a {lugar} canta de noche, siempre la misma canción. Nadie la conoce, pero todos se la saben."
    historias:
      - - "Luces raras en {lugar}"
        - "Por las noches se ven luces verdes sobre {lugar}. El cura dice que es {amenaza}."
      - - "Las vacas de {lugar}"
        - "Cerca de {lugar} las vacas dan leche agria y miran raro. El albéitar dice que eso no es cosa suya."
      - - "La niña que sabe cosas"
        - "Cerca de {lugar} hay una niña que dice lo que va a pasar mañana. Ayer acertó. El alcalde está muy nervioso."
      - - "Desaparecidos en {lugar}"
        - "Tres vecinos han desaparecido en un mes. Todos habían ido a por agua a {lugar}."
    amenazas:
      - "un espectro"
      - "un brujo de feria"
      - "una maldición vieja"
      - "un espíritu con cuentas pendientes"
      - "una bruja del pantano"
      - "un duende rencoroso"
      - "un culto de aficionados"
      - "algo que vive en los espejos"
  Limpiar:
    titulos:
      - "Limpiar {lugar}"
      - "Plaga en {lugar}"
      - "Bichos en {lugar}"
    textos:
      - "Hay {amenaza} en {lugar}, y la feria es dentro de una semana."
      - "Una familia volvió de la feria y se encontró {amenaza} en casa, cerca de {lugar}. No piensan mudarse."
      - "En {lugar} hay {amenaza}. Huele peor que de costumbre, que ya es decir."
    historias:
      - - "Ratas en {lugar}"
        - "«Son ratas, pero grandes. Muy grandes. Bueno, una.» Está en {lugar}."
      - - "El sótano del alquimista"
        - "El difunto guardaba «cosas de alquimia» en {lugar}. Desde el entierro, algo se mueve ahí abajo."
      - - "La bodega cerrada"
        - "Una bodega junto a {lugar} lleva un mes cerrada. El vino sigue dentro, y {amenaza} también."
      - - "El molino abandonado"
        - "Algo ha hecho nido en un molino viejo junto a {lugar}. El molinero ya no muele; ahora solo maldice."
      - - "El cementerio no descansa"
        - "Los muertos del cementerio, junto a {lugar}, no se están quietos. El enterrador pide ayuda y una pala nueva."
    amenazas:
      - "una rata gigante"
      - "babosas ácidas"
      - "un nido de kobolds"
      - "un limo con hambre"
      - "avispas gigantes"
      - "esqueletos que no se están quietos"
      - "un enjambre de murciélagos"
      - "trasgos que se han instalado a vivir"
