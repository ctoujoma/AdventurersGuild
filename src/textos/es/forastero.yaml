llega: "Con la tormenta ha entrado un forastero encapuchado. Se ha sentado junto al fuego y pregunta por tus caídos. Se irá mañana a mediodía."
monedas: "{n} monedas"
raciones: "{n, plural, one {# ración} other {# raciones}}"
jarras: "{n, plural, one {# jarra} other {# jarras}}"
se_fue: "El forastero ya no está."
no_caido: "No está entre los caídos."
falta: "Falta: {que}."
historial: "Día {dia} · Volvió del velo: lo trajo el forastero de la tormenta"
vuelve: "El forastero pide que apaguen las velas. Cuando vuelven a encenderlas, {heroe} respira en el catre, {sexo, select, f {pálida y helada} other {pálido y helado}}. El forastero ya no está."
rechazado: "El forastero se encoge de hombros, se cala la capucha y sale a la tormenta."
se_va: "A mediodía, el sitio junto al fuego está vacío: el forastero se ha ido sin que nadie le viera salir."
