# Rumores de la barra (data/rumors.ts). {place}: el lugar del encargo que abren.

rumores:
  - "Un arriero jura que en {lugar} algo brilla bajo las piedras."
  - "Dos leñadores cuchichean: en {lugar} hay una cueva que no estaba el invierno pasado."
  - "Una buhonera dice que vio una espada clavada en un tocón, cerca de {lugar}."
  - "El viejo del rincón habla de un tesoro enterrado en {lugar}. Esta vez parece sobrio."
  - "Un pastor cuenta que algo grande se lleva las ovejas de {lugar}, y que deja oro a cambio."
  - "Un forastero paga una ronda y pregunta, muy bajito, por el camino a {lugar}."
  - "Se oye que un mercader perdió un cofre sellado en {lugar} y nadie ha ido a buscarlo."
  - "Una cantinera ha oído campanas bajo tierra en {lugar}. Las ha oído tres noches."
  - "Un soldado borracho presume del botín que dejó escondido en {lugar}."
  - "Dicen que la bruja de {lugar} se ha ido y su casa está abierta."
encargo: "{rumor} {texto}"
apuntado: "Lo apuntas: «{titulo}» ya está en el tablón, con {objeto} de botín."
