# Glosario de Ajustes (data/glossary.ts): qué es cada cosa del juego.

terminos:
  oro_y_proximo_pago:
    termino: "Oro y próximo pago"
    texto: "Lo que hay en la caja. Junto al pergamino de arriba está lo que toca pagar y qué día: la cuota a Merlo más los salarios de la semana. Si no llega, se acaba la partida."
  reputacion_y_rango:
    termino: "Reputación y rango"
    texto: "Sube con los encargos bien hechos y baja con los fracasos. Con cada rango llegan encargos mejor pagados, mejores candidatos y más clientes en la taberna."
  riesgo_de_un_encargo:
    termino: "Riesgo de un encargo"
    texto: "Pan comido, Probable, Arriesgado o Suicida. Sale de comparar el grupo con el peligro del encargo; cambia según a quién mandes."
  peligro:
    termino: "Peligro"
    texto: "Las calaveras del mapa (de una a cuatro) y el color del encargo, de verde (bajo) a rojo (letal). Con «?» no se sabe hasta mejorar la sala de mapas."
  historias:
    termino: "Historias"
    texto: "Encargos encadenados que llegan por carta. Cada paso abre el siguiente; en el mapa el hilo rojo une los pasos hechos (✓) con el que falta (número). Si dejas uno esperando, la comarca se revuelve."
  jefes:
    termino: "Jefes"
    texto: "Algunas historias acaban contra un jefe. Esa noche, al amanecer, sale un aviso para ver la pelea; si la dejas para luego, queda en el informe con «Ver la batalla»."
  amenaza_de_la_comarca:
    termino: "Amenaza de la comarca"
    texto: "Crece cada noche que un paso de historia espera en el tablón y baja si no hay ninguna en marcha. Alta, asaltan las caravanas, llegan menos encargos y vienen bandidos a la taberna."
  asaltos_y_chivatazos:
    termino: "Asaltos y chivatazos"
    texto: "Desde el día 12, una banda puede atacar la taberna de noche. Con suerte alguien avisa antes (la bandera roja de arriba cuenta las noches). Se pelea sala a sala: los de guardia (dos como mucho) salen al patio y dan la alarma; si caen, rompen la puerta y van a por la cámara del tesoro. Los que duermen acuden corriendo, y la puerta, la cerradura y la distancia les dan tiempo. Lo que cargan los bandidos se recupera si caen antes de salir."
  camara_del_tesoro:
    termino: "Cámara del tesoro"
    texto: "Guarda todo el oro del gremio; cuanto más grande y mejor, más cabe. Lo que no cabe se pierde (el oro de arriba se pone en amarillo cuando está casi llena). Su nivel es también la cerradura que tienen que forzar los bandidos."
  moral:
    termino: "Moral"
    texto: "Las ganas de trabajar. Baja con los viajes y los fracasos, sube descansando en la taberna. Muy baja, rinden menos y pueden irse una noche cualquiera."
  heridos_y_desaparecidos:
    termino: "Heridos y desaparecidos"
    texto: "Los heridos se curan en la enfermería. Un desaparecido se perdió en una misión: puede volver solo (la capilla ayuda) o con un encargo de rescate."
  nivel_y_veteranos:
    termino: "Nivel y veteranos"
    texto: "La experiencia sube el nivel y con él el salario. Desde el nivel 8 son veteranos (el ala de veteranos les da descanso extra y ya no desertan) y desde el 12, maestros; el nivel más alto es el 15. Al hacerse veteranos y maestros piden su caché."
  equipo:
    termino: "Equipo"
    texto: "Lo traen algunos encargos («+ objeto»). Se da desde el arcón o la ficha del héroe. {rarezas, mayus}; el marco lleva su color. Si el héroe muere, el objeto se pierde."
  trofeos:
    termino: "Trofeos"
    texto: "Un éxito brillante en un encargo peligroso deja un trofeo. Colgado en la sala, atrae clientes: monedas cada día."
  modo_libre:
    termino: "Modo libre"
    texto: "Con la deuda saldada el gremio es tuyo y la partida sigue. Otros gremios pujan por los encargos y pagan menos; los salarios se pagan cada 7 días y dos semanas sin pagar acaban con todo."
  fiesta_de_la_comarca:
    termino: "Fiesta de la comarca"
    texto: "Cada 10 días. Si la montas en la taberna, esa noche la caja se dobla y los que descansan se animan."
