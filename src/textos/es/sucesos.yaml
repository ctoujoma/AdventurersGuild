amenaza:
  # Amenaza alta: asaltan una caravana y sale un encargo para recuperar lo robado ({titulo}).
  caravana: "Unos salteadores han asaltado una caravana en el camino real. Los arrieros piden ayuda: «{titulo}» está en el tablón."
  # Amenaza alta: unos días ({n}) viene menos gente a la taberna.
  miedo: "Corre el miedo por los caminos: {n, plural, one {mañana} other {estos # días}} vendrá menos gente a la taberna."
  por_historia: "el siguiente paso de «{historia}» espera en el tablón"
  por_quietud: "hace días que no sale nadie de encargo"
  en_camino: "hay grupos por los caminos"
  en_calma: "la comarca está en calma"
  tramo_caravanas: "asaltan caravanas: salen encargos para recuperar lo robado"
  tramo_encargos: "llegan menos encargos al tablón y, a ratos, menos gente a la taberna"
  tramo_asaltos: "los bandidos se fijan más en el gremio: más asaltos"
# El encargo de la caravana asaltada (Recuperar): {carga} es una de `cargas`; {lugar}, dónde se esconden.
caravana:
  titulo: "Recuperar {carga}"
  texto: "Unos salteadores asaltaron la caravana que traía {carga} y se esconden cerca de {lugar}. Los arrieros pagan bien a quien lo recupere, y la comarca no lo olvidará."
  cargas:
    - "el vino de la ribera"
    - "la sal del puerto"
    - "las telas de Levante"
    - "el grano del molino"
buhonero:
  texto: "Un buhonero con un carro lleno de cachivaches jura que tiene «un objeto de verdad» escondido bajo la lona. Pide 60 monedas, sin enseñarlo antes."
  opciones:
    - etiqueta: "Comprar (60)"
      pista: "Equipo bueno… o no"
    - etiqueta: "No, gracias"
      pista: "Nada cambia"
  bueno: "Era de verdad: {objeto}. Ya cuelga en el tablero de la bodega."
  malo: "Era… {objeto, minus}. El buhonero ya va por el segundo cruce."
  no: "El buhonero se va silbando."
pelea:
  texto: "{a} y {b} se han enzarzado en la barra por una apuesta. Vuelan jarras."
  opciones:
    - etiqueta: "Mediar e invitar a una ronda"
      pista: "−10 monedas, más moral"
    - etiqueta: "Que lo arreglen ellos"
      pista: "Uno gana, otro pierde"
  ronda: "Una ronda y un apretón de manos. {a} y {b} acaban cantando juntos."
  solos: "{a} gana la discusión y la apuesta. {b} no le habla en días."
bardo:
  texto: "Un bardo de paso pide cantar esta noche a cambio de cena y un rincón para dormir."
  opciones:
    - etiqueta: "Que cante"
      pista: "−5 monedas, moral para todos"
    - etiqueta: "Echarlo"
      pista: "Nada cambia"
  canta: "Canta romances de bandoleros y la sala acaba coreando el estribillo."
  no: "Se va refunfuñando. Esa noche canta en la posada de enfrente."
noble:
  texto: "Un noble arruinado ofrece la espada de su familia en prenda por 100 monedas. Jura que volverá a por ella antes del invierno."
  opciones:
    - etiqueta: "Aceptar (100)"
      pista: "Un objeto valioso"
    - etiqueta: "Rechazar"
      pista: "Nada cambia"
  si: "Te quedas {objeto, minus}. El noble no vuelve, claro."
  no: "Se marcha con su espada y su orgullo."
lobos:
  texto: "Unos aldeanos piden ayuda: los lobos bajan cada noche al redil. No tienen con qué pagar."
  opciones:
    - etiqueta: "Ayudar gratis"
      pista: "+6 reputación, algún riesgo"
    - etiqueta: "Negarse"
      pista: "−2 reputación"
  mordisco: "{heroe} ahuyenta a los lobos, pero vuelve con un mordisco: dos días en cama. En el pueblo hablan bien del gremio."
  ayuda: "{heroe} ahuyenta a los lobos. En el pueblo hablan bien del gremio."
  no: "Los aldeanos se van cabizbajos. Se correrá la voz."
apuesta:
  texto: "Un forastero con un dado de hueso reta a la casa: 30 monedas a que saca más que el tabernero."
  opciones:
    - etiqueta: "Apostar 30"
      pista: "Doble o nada"
    - etiqueta: "Aquí no se juega"
      pista: "Nada cambia"
  gana: "El tabernero saca un seis. El forastero paga, y se va sin terminarse la cerveza."
  pierde: "El forastero saca un seis y el tabernero un dos. Recoge las monedas y pide otra jarra."
  no: "El forastero se encoge de hombros y busca otra taberna."
