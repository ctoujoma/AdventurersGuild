# La ficha del encargo en curso (data/journey.ts y core/journey.ts). Huecos: {lugar} el lugar,
# {enemigos} los enemigos, {heroe} un héroe.

tramos:
  ida:
    nombre: "De camino"
  llegada:
    nombre: "Llegan"
  faena:
    nombre: "Manos a la obra"
  vuelta:
    nombre: "De vuelta"
camino:
  rio:
    - "Cruzan el vado con el agua por las rodillas."
    - "{heroe} se para a llenar las cantimploras en la orilla."
    - "Siguen la ribera entre juncos y mosquitos."
  pueblo:
    - "Pasan por un mercado; {heroe} regatea un pan de higos."
    - "Unos críos los siguen un trecho por el camino real."
    - "Un carretero les cuenta las últimas habladurías."
  monte:
    - "Suben por una trocha de cabras."
    - "{heroe} resbala en una pedrera, pero no pasa nada."
    - "Desde el collado se ve la taberna, pequeña, allá abajo."
  bosque:
    - "El camino se pierde entre robles viejos."
    - "{heroe} jura que algo los sigue entre los helechos."
    - "Encuentran setas; nadie se atreve a probarlas."
  costa:
    - "El viento del mar les tira de las capas."
    - "Bajan a la playa por un sendero de sal."
    - "{heroe} recoge una concha para la barra."
  pantano:
    - "Avanzan de mata en mata para no hundirse."
    - "Las ranas se callan de golpe cuando pasan."
    - "{heroe} pierde una bota en el lodo y la recupera."
  campo:
    - "Atajan por un trigal; un labriego les grita."
    - "Comen a la sombra de una encina."
    - "{heroe} canta para llevar el paso."
  ruina:
    - "Pasan junto a una muralla caída cubierta de hiedra."
    - "Ven marcas viejas en las piedras del camino."
    - "{heroe} se guarda una moneda antigua que asomaba en el barro."
trabajo:
  Cazar:
    - "Encuentran huellas frescas y las siguen."
    - "Preparan la emboscada a favor del viento."
  Escoltar:
    - "Se ponen en marcha con el carro."
    - "{heroe} va delante, mirando cada recodo."
  Explorar:
    - "Dibujan el sitio en un pliego."
    - "{heroe} se mete por un paso estrecho con la antorcha."
  Recuperar:
    - "Buscan entre los escombros."
    - "{heroe} cree que lo tiene cerca."
  Investigar:
    - "Preguntan a los vecinos de {lugar}."
    - "{heroe} encuentra algo que no encaja."
  Limpiar:
    - "Sacan a los primeros de su madriguera."
    - "Se cierran en formación y avanzan."
enemigos:
  alimana: "alimañas"
  muerto: "muertos que no descansan"
  grande: "bestias enormes"
  bandido: "bandidos"
  trasgo: "trasgos"
  bestia: "bestias"
pelea:
  - "Les salen al paso {enemigos}. ¡A las armas!"
  - "Se lían a golpes con {enemigos}."
  - "{heroe} da la voz: {enemigos}, y vienen derechos."
llegar:
  - "Llegan a {lugar}."
  - "Por fin, {lugar}."
volver:
  - "Emprenden la vuelta."
  - "Recogen y vuelven hacia la taberna."
acampar:
  - "Acampan para pasar la noche."
  - "Duermen al raso; {heroe} hace la primera guardia."
aparece: "Aparece {jefe}."
aviso: "Mandan aviso: {resultado, minus}.{malo, select, si {} other { Ya vienen.}}"
