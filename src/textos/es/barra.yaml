  han_desmontado_pero_no: "Han desmontado {objeto}, pero no han sacado nada en claro."
  en_el_rincon_de: "En el rincón de la bodega ya no caben más materiales y lo que sobra se vende barato. Construye un almacén."
  en_el_rincon_de_2: "En el rincón de la bodega ya no caben más materiales y lo que sobra se vende barato. Cuando pagues la deuda podrás construir un almacén."
  un_forastero_encapuchado_espera: "Un forastero encapuchado espera junto al fuego: ofrece traer de vuelta a un caído. Se irá {hoy, select, si {hoy} other {mañana}} a mediodía."
  da_vueltas_en_la: "{nombre} da vueltas en la cama, entre pesadillas. {sexo, select, f {Tócala} other {Tócalo}} para llevarle un trago de la bodega."
  terminada_la_obra_de: "¡Terminada la obra de {job_room_name}! Ya funciona."
  titulo: "«{titulo}»"
tips:
  el_tablon_de_encargos: "El tablón de encargos está en el salón: toca la sala y ábrelo. Toca un encargo, elige a quién mandas y fíjate en el riesgo. Mejor «Probable» que «Suicida»."
  cuando_un_grupo_se: "Cuando un grupo se va, tarda unos días en volver. Por la mañana llega su informe a la campana de arriba."
  cada_grupo_que_vuelve: "Cada grupo que vuelve manda su informe (el sobre de abajo). Léelo, que ahí se ve de qué pasta está hecho cada cual."
  en_la_barra_hay: "En la barra hay gente que busca trabajo. Con dos héroes no vas a ningún lado, así que contrata a alguien. Mira bien la prima y el salario, que se paga cada semana."
  el_dia_viene_merlo: "El día {dia} viene Merlo a cobrar {cantidad} monedas, más los salarios. Lo que toca pagar lo tienes arriba, en el pergamino. Si no llegas, se queda la taberna, gato incluido."
  cuando_tengas_algo_ahorrado: "Cuando tengas algo ahorrado, arregla la casa desde «Gremio». Más camas, una enfermería, una taberna que deje dinero. Todo sirve para algo y luce en la casa."
  remedios_cocina_tobias_atiende: "Remedios cocina, Tobías atiende el salón y Nico sube los barriles de la bodega. Vienen cada mañana del pueblo y cobran con los héroes. Toca una sala para ver quién trabaja en ella. Para cambiar a alguien de sitio, cógelo con el dedo y suéltalo en otra sala; los héroes que se quedan en casa también pueden echar una mano."
  alguien_anda_desanimado_y: "Alguien anda desanimado y rinde menos. Déjalo descansar en la taberna unos días, o súbele el sueldo si te lo pide. El que está harto se larga cualquier noche."
  el_equipo_que_traen: "El equipo que traen los grupos se guarda en la armería (en arcones, mientras esté rota). Dáselo a alguien desde su ficha. Eso sí: si cae en una misión, el objeto se pierde con él."
  los_trofeos_se_cuelgan: "Los trofeos se cuelgan en el salón. La gente viene a verlos, se toma algo y eso son monedas cada día."
  si_has_pagado_a: "Si has pagado a Merlo, la casa es tuya del todo y se acabaron los apaños: ahora se hace obra de verdad. Toca el martillo, a la derecha, para el modo obras: abajo eliges una sala nueva y luego dónde va. Si tocas una sala, la amplías, la mueves o la tiras."
  en_el_modo_obras: "En el modo obras todo se hace de mentira hasta que pagas: ves cómo queda y lo que cuesta. Puedes dejar una sala sin paso un momento mientras mueves otras; solo hay que arreglarlo antes de pagar. Si no te convence, sales y no pierdes ni una moneda."
  debajo_del_sotano_hay: "Debajo del sótano hay roca. En el modo obras se marcan los huecos que se pueden excavar, con su precio: tócalos y listo. Cuanto más hondo, más caro. Hacia arriba también se sube, pero cada planta solo sobresale un hueco de la de abajo."
  ahora_viene_gente_del: "Ahora viene gente del pueblo a pedir trabajo: lo verás en «Héroes», pestaña «Barra». Pero cada uno nuevo necesita su cama, así que antes construye el dormitorio del servicio."
  la_caja_la_llenan: "La caja la llenan los que vienen al salón: campesinos, mercaderes y, si el salón luce, algún noble que trae fama. Cuanto más Atractivo (decoración, fachada, trofeos), más gente; pero si nadie atiende la barra, se van sin pagar. Ojo con los forasteros que miran demasiado."
  lo_que_hace_remedios: "Lo que hacen Remedios en la cocina y Nico en la bodega se junta durante el día sobre su sala: tócalo para recogerlo (al anochecer se recoge solo). Lo tienes arriba: el pan son las raciones y la jarra, la cerveza. Los visitantes comen y beben de ahí, y los de casa cenan antes de dormir. Si no llega, pon a alguien más en la cocina o arréglala; quien se acuesta sin cenar se levanta de mal humor."
  ya_tienes_donde_entrenar: "Ya tienes donde entrenar. Coge con el dedo a un héroe que esté en casa y suéltalo en la sala: la barra sobre su cabeza dice cuánto le falta para el siguiente punto. Cada sala tiene un tope; mejorándola, se llega más lejos."
  todo_el_oro_se: "Todo el oro se guarda en la cámara del tesoro, y ya casi no cabe más: lo que sobre se perderá. Mejórala (o, cuando puedas hacer obras, hazla más grande). Su nivel es también la cerradura que tendrían que forzar los bandidos."
