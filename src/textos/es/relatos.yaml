    - - "El objeto seguía en {lugar}. El problema era el bicho que dormía encima."
      - "El objeto seguía en {lugar}. El problema era el bicho que dormía encima."
    - - "{grupo} entró en {lugar} por la ventana, porque la puerta tenía demasiados cerrojos."
      - "{grupo} entraron en {lugar} por la ventana, porque la puerta tenía demasiados cerrojos."
  Investigar:
    - - "En {lugar} todos tenían coartada, y todas eran la misma taberna."
      - "En {lugar} todos tenían coartada, y todas eran la misma taberna."
    - - "{grupo} empezó por lo de siempre: preguntar a la vieja que lo ve todo desde su ventana."
