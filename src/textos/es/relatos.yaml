      - "Las huellas eran tan grandes que {grupo} tuvieron que mirarlas dos veces."
    - - "{grupo} salió hacia {lugar} antes de que cantara el gallo, con un cordero atado de cebo."
      - "{grupo} salieron hacia {lugar} antes de que cantara el gallo, con un cordero atado de cebo."
    - - "En {lugar} nadie salía de casa al anochecer. Mala señal para quien va de caza."
      - "En {lugar} nadie salía de casa al anochecer. Mala señal para quien va de caza."
