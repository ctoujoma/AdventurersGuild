# Frases de los informes de los encargos (data/stories.ts y data/tales.ts). Huecos que rellena
# el núcleo (core/resolve.ts): {heroe} el protagonista, {a} y {b} dos del grupo, {grupo} el
# grupo, {lugar} el lugar, {cliente} el cliente, {oro} monedas, {objeto} un objeto, {rasgo} un
# rasgo. Con «, mayus», el hueco empieza frase. comienzos: [uno, varios].

comienzos:
  Cazar:
    - - "{grupo} siguió el rastro hasta {lugar} durante dos noches."
      - "{grupo} siguieron el rastro hasta {lugar} durante dos noches."
    - - "{grupo} se apostó en {lugar} con el viento en contra."
      - "{grupo} se apostaron en {lugar} con el viento en contra."
  Escoltar:
    - - "{grupo} caminó junto a la carreta todo el trayecto hasta {lugar}."
      - "{grupo} caminaron junto a la carreta todo el trayecto hasta {lugar}."
    - - "El mercader no paró de hablar en todo el camino a {lugar}. {grupo} aguantó."
      - "El mercader no paró de hablar en todo el camino a {lugar}. {grupo} aguantaron."
  Explorar:
    - - "{grupo} bajó a {lugar} con una cuerda y una antorcha que no paraba de humear."
      - "{grupo} bajaron a {lugar} con una cuerda y dos antorchas que no paraban de humear."
    - - "{lugar, mayus} era más grande por dentro de lo que parecía por fuera."
      - "{lugar, mayus} era más grande por dentro de lo que parecía por fuera."
  Recuperar:
    - - "{grupo} llegó a {lugar} cuando ya era noche cerrada."
      - "{grupo} llegaron a {lugar} cuando ya era noche cerrada."
    - - "El encargo parecía fácil, y eso a {grupo} tendría que haberle escamado."
      - "El encargo parecía fácil, y eso a {grupo} tendría que haberles escamado."
  Investigar:
    - - "{grupo} pasó la noche en {lugar} con los ojos muy abiertos."
      - "{grupo} pasaron la noche en {lugar} con los ojos muy abiertos."
    - - "Nadie en {lugar} quería hablar. {grupo} invitó a una ronda y entonces hablaron todos."
      - "Nadie en {lugar} quería hablar. {grupo} invitaron a una ronda y entonces hablaron todos."
  Limpiar:
    - - "{grupo} bajó a {lugar} con una escoba, una espada y poca paciencia."
      - "{grupo} bajaron a {lugar} con una escoba, una espada y poca paciencia."
    - - "El olor de {lugar} se notaba desde el camino."
      - "El olor de {lugar} se notaba desde el camino."
lineas:
  Combate:
    ok:
      - "{heroe} se plantó delante y no retrocedió ni un paso."
      - "{heroe} repartió golpes con más entusiasmo que técnica, pero funcionó."
      - "Cuando llegó la carga, {heroe} ya estaba esperando."
    ko:
      - "Eran más de los que decía el encargo, y {heroe} se llevó la peor parte."
      - "{heroe} cargó primero y pensó después. Esta vez salió mal."
      - "La espada de {heroe} se quedó clavada en un tronco en el peor momento."
  Trampas:
    ok:
      - "{heroe} encontró el cable antes de que nadie lo pisara."
      - "La cerradura cedió en cuanto {heroe} le habló bajito."
      - "{heroe} vio la losa suelta y avisó a los demás para que no la pisaran."
    ko:
      - "La trampa saltó; {heroe} todavía tiene el susto en el cuerpo."
      - "{heroe} juró que esa losa no estaba ahí antes."
      - "{heroe} estuvo media hora con la cerradura y no hubo manera. Su versión es otra."
  Arcano:
    ok:
      - "{heroe} leyó las runas en voz alta y lo que gruñía al fondo dejó de gruñir."
      - "{heroe} reconoció el símbolo a tiempo y nadie tocó lo que no debía."
      - "{heroe} hizo un gesto, la sala olió a azufre un momento y asunto resuelto."
    ko:
      - "{heroe} pronunció mal una palabra. Las velas se apagaron todas a la vez."
      - "{heroe} dijo que entendía lo que ponía en la pared. No entendía ni una letra."
      - "El conjuro de {heroe} funcionó, pero sobre la persona equivocada."
  Supervivencia:
    ok:
      - "{heroe} encontró un atajo por el barranco y ganaron medio día."
      - "{heroe} olió la emboscada antes de verla."
      - "Gracias a {heroe} durmieron a cubierto y comieron caliente todas las noches."
    ko:
      - "Se perdieron dos veces. {heroe} jura que el mapa estaba mal."
      - "Llovió tres días seguidos y {heroe} eligió el peor sitio para acampar."
      - "{heroe} confundió setas con setas. Dos días de retortijones."
cierres:
  brillante:
    - "Volvieron cantando y con la bolsa llena."
    - "El cliente pagó, dejó propina y abrazó a todo el mundo."
  exito:
    - "Trabajo hecho. El cliente pagó sin rechistar."
    - "Encargo cumplido, sin sustos y sin mucha historia."
  parcial:
    - "El cliente pagó la mitad, «por las molestias»."
    - "Medio trabajo, media paga y una discusión larguísima."
  fracaso:
    - "Volvieron con las manos vacías y los pies llenos de ampollas."
    - "El cliente no soltó ni una moneda, y encima se quejó."
  desastre:
    - "Volvieron peor de lo que se fueron, y sin nada."
    - "Nadie quiere hablar de lo que pasó allí."
ambiente:
  - "Un bardo lleva toda la mañana desafinando en la barra. Es primo del herrero, así que nadie dice nada."
  - "Alguien ha grabado «Brom nunca falla» en una mesa. Debajo, con otra letra, pone «ya, ya»."
  - "Bigotes ha dejado en la puerta algo que no es un ratón. El tabernero lo ha tapado con un cubo."
  - "Hoy hay sopa con tropezones. El tabernero jura que es tocino."
  - "Un viajero pregunta si es aquí donde contratan héroes «baratos, pero no tanto»."
  - "Ha llovido toda la noche. A la gotera de la bodega ya la llaman Gertrudis."
  - "El prestamista ha pasado por delante de la puerta, despacio, mirando hacia dentro."
  - "Dos parroquianos discuten si un grifo es más pájaro o más gato. Ya hay dinero en la mesa."
  - "El tabernero jura que el retrato del tío Fausto le guiña un ojo por las noches."
  - "Un crío ha entrado a acariciar a Bigotes. Ha salido con un arañazo y tan contento."
cicatrices:
  "0":
    nick:
      m: "el Tuerto"
      f: "la Tuerta"
    texto: "ha perdido un ojo"
  "1":
    nick:
      m: "Pata Chula"
      f: "Pata Chula"
    texto: "se ha dejado media rodilla entre las rocas"
  "2":
    nick:
      m: "Cara Cortada"
      f: "Cara Cortada"
    texto: "lleva un tajo de oreja a barbilla"
