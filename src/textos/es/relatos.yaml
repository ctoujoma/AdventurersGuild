mas_lineas:
  Combate:
    ok:
      - "{heroe} esquivó el primer golpe y no hubo un segundo."
      - "{heroe} pegó un grito tan bestia que la mitad salió corriendo antes de empezar."
      - "{heroe} usó una silla, una cacerola y, al final, la espada."
    ko:
      - "{heroe} resbaló en el barro justo cuando más falta hacía estar de pie."
      - "El escudo de {heroe} paró el golpe, pero el brazo se llevó un buen crujido."
      - "Les cayeron por la espalda y {heroe} no se dio cuenta hasta que fue tarde."
  Trampas:
    ok:
      - "{heroe} desmontó el mecanismo y se guardó un muelle «por si acaso»."
      - "Un dardo pasó silbando junto a la oreja de {heroe}, que ya se había agachado."
      - "{heroe} fue tanteando cada baldosa con la punta del cuchillo. Tardaron, pero pasaron."
    ko:
      - "Un clic, un silbido y {heroe} con el pelo chamuscado."
      - "La red cayó del techo y {heroe} quedó colgando como un jamón."
      - "{heroe} abrió el cofre. El cofre mordió."
  Arcano:
    ok:
      - "{heroe} trazó un círculo de sal y lo que acechaba no se atrevió a cruzarlo."
      - "El libro maldito se cerró solo cuando {heroe} le recitó su propio nombre."
      - "A {heroe} se le erizó el vello de los brazos y dio la voz de alarma antes que nadie."
    ko:
      - "El amuleto de {heroe} se puso al rojo vivo y hubo que tirarlo a un charco."
      - "{heroe} leyó el pergamino del revés. Durante una hora, todos hablaron al revés."
      - "Lo que dormía en la cripta despertó, y {heroe} no supo volver a dormirlo."
  Supervivencia:
    ok:
      - "{heroe} vio venir la tormenta por el color del cielo y encontró una cueva a tiempo."
      - "{heroe} cazó, desplumó y asó un faisán mientras los demás montaban el campamento."
      - "Siguiendo el musgo de los árboles, {heroe} los sacó del bosque sin un rasguño."
    ko:
      - "{heroe} encendió la hoguera con leña verde. Echó humo toda la noche y no calentó nada."
      - "El río estaba más crecido de lo que {heroe} calculó. Perdieron media carga."
      - "{heroe} dejó la comida sin colgar y los lobos cenaron mejor que el grupo."
por_clase:
  guerrero:
    ok:
      - "{heroe} se puso delante, como hace siempre, y aguantó todo lo que le echaron."
      - "{heroe} no se anduvo con rodeos. Dos tajos y a otra cosa."
    ko:
      - "{heroe} quiso arreglarlo a espadazos, y aquello no se arreglaba así."
      - "La armadura de {heroe} pesaba demasiado para aquel terreno, y se notó."
  picaro:
    ok:
      - "{heroe} se escurrió por la parte de atrás y abrió la puerta desde dentro."
      - "{heroe} entró y salió sin que nadie se diera cuenta, que para eso se le paga."
    ko:
      - "{heroe} intentó colarse y tropezó con el único cubo de todo el pasillo."
      - "Hasta a {heroe} se le resbalan los dedos de vez en cuando."
  mago:
    ok:
      - "{heroe} murmuró algo en una lengua muerta y la cosa se calmó."
      - "Una chispa azul en la mano de {heroe} y el camino quedó despejado."
    ko:
      - "A {heroe} se le enredó la lengua a mitad del conjuro. Salieron sapos."
      - "{heroe} lo tenía todo calculado, menos el viento."
  clerigo:
    ok:
      - "{heroe} rezó en voz alta y, quizá por casualidad, todo salió bien."
      - "Con una bendición y un buen bastonazo, {heroe} lo dejó todo en paz."
    ko:
      - "Los dioses estaban ocupados en otra cosa cuando {heroe} los llamó."
      - "Cuando {heroe} acabó la oración, ya era tarde."
  explorador:
    ok:
      - "{heroe} conocía un sendero de cabras que no sale en ningún mapa."
      - "{heroe} pegó la oreja al suelo y supo por dónde venían."
    ko:
      - "Por primera vez en años, {heroe} se perdió, y no quiere que se sepa."
      - "El rastro que siguió {heroe} era de un jabalí. Un jabalí con muy mal genio."
por_rasgo:
  velo:
    - "{heroe} se quedó mirando una tumba del camino más de la cuenta. Dice que le saludaron."
    - "Por la noche, junto al fuego, {heroe} no habla del otro lado. Nadie se atreve a preguntar."
  valiente:
    - "{heroe} se ofreció a ir delante sin que nadie se lo pidiera."
    - "{heroe} se rió del peligro, y el peligro le dejó un recuerdo en la pierna."
  cobarde:
    - "{heroe} sugirió tres veces dar media vuelta «por prudencia»."
    - "Cada vez que crujía una rama, {heroe} acababa detrás de alguien."
  codicioso:
    - "{heroe} tasó todo lo que veía, incluidas las botas del cliente."
    - "{heroe} preguntó dos veces si la paga era por cabeza o por grupo."
  afortunado:
    - "{heroe} se encontró una moneda en el camino. Luego otra. Luego otra."
    - "Una flecha perdida rebotó en la hebilla de {heroe}. Ni un rasguño."
  gafe:
    - "Desde que {heroe} se unió al viaje, se rompieron dos correas y se cruzaron tres gatos negros."
    - "Se puso a llover justo cuando {heroe} dijo «qué buen día hace»."
  bebedor:
    - "{heroe} llevaba una bota de vino «para desinfectar heridas». Llegó vacía."
    - "La primera pregunta de {heroe} al llegar a {lugar} fue dónde estaba la taberna."
  leal:
    - "{heroe} no se separó del grupo ni para dormir."
    - "{heroe} cargó con la mochila de un compañero sin decir nada."
  arrogante:
    - "{heroe} explicó a todo el grupo cómo hacer su trabajo. Varias veces."
    - "{heroe} dejó claro que, en su opinión, aquello era poca cosa para su talento."
  supersticioso:
    - "{heroe} se negó a cruzar el puente hasta escupir tres veces al río."
    - "{heroe} colgó ajos en la tienda. Nadie durmió bien, pero tampoco vino ningún vampiro."
  tuerto:
    - "Con el parche, a {heroe} le bastaba con mirar mal para que se apartaran."
  cojo:
    - "{heroe} renqueó todo el camino sin una queja. Bueno, con alguna."
  cortado:
    - "Bastó con que {heroe} sonriera para que nadie buscara pelea."
camino:
  - "A medio camino se cruzaron con un buhonero que vendía «agua de la fuente de la juventud». Olía a pozo."
  - "Durmieron en una posada donde la sopa era aún peor que la de El Jarro Partido. No lo creían posible."
  - "Un pastor les indicó el camino a cambio de que le escucharan cantar. Cantaba mal y largo."
  - "La tormenta los pilló en campo abierto y pasaron la noche en un granero, con una cabra muy curiosa."
  - "En un cruce, un cartel decía «A {lugar}, una legua». Eran tres."
  - "Se cruzaron con otra cuadrilla de aventureros. Se saludaron con la cabeza y nadie dijo adónde iba."
  - "Un niño les siguió dos leguas preguntando si eran héroes de verdad."
  - "Durmieron al raso. Alguien roncó toda la noche y nadie reconoce haber sido."
hallazgos:
  - "Junto al camino encontraron una bolsa con {oro} monedas. Preguntaron en la venta más cercana, pero sin mucho empeño."
  - "Un mercader agradecido por ahuyentar a unos lobos les dio {oro} monedas de propina."
  - "Un bandido dormía la mona junto al camino con {oro} monedas en el bolsillo. Se despertó más ligero."
piques:
  - "{a} y {b} discutieron todo el viaje sobre si un dragón vence a un gigante. No hubo acuerdo."
  - "{a} le enseñó a {b} una canción de taberna. Ya no hay quien la pare."
  - "{a} roncó toda la noche y {b} amaneció con ojeras y ganas de venganza."
  - "{a} y {b} se apostaron la cena a ver quién volvía con más rasguños."
  - "{a} le salvó el pellejo a {b}, y se lo va a recordar durante meses."
  - "{a} y {b} no se dirigieron la palabra en todo el viaje. Algo pasó la primera noche."
desanimados:
  - "{heroe} iba con la cabeza en otra parte, y se notó."
  - "{heroe} apenas abrió la boca en todo el viaje, y casi no comió."
  - "{heroe} preguntó en voz alta para qué se juega uno el pellejo por tan poco."
animados:
  - "{heroe} fue silbando todo el camino y al final silbaban todos."
  - "{heroe} iba con tantas ganas que tiraba del grupo."
cierres_cliente:
  brillante:
    - "{cliente, mayus} prometió hablar bien del gremio en todas las tabernas de la comarca."
    - "{cliente, mayus} quiso invitarles a cenar. Aceptaron, claro."
  exito:
    - "{cliente, mayus} contó las monedas dos veces, pero pagó."
    - "{cliente, mayus} dio las gracias con un apretón de manos algo flojo."
  parcial:
    - "{cliente, mayus} pagó refunfuñando y pidió descuento para la próxima vez."
    - "{cliente, mayus} dijo que «algo es algo». Lo dijo con muy mala cara."
  fracaso:
    - "{cliente, mayus} cerró la puerta sin decir palabra."
    - "{cliente, mayus} dice que la próxima vez buscará otro gremio."
  desastre:
    - "{cliente, mayus} ha pedido que no vuelvan a pasar por allí."
    - "Dicen que {cliente} va contando lo ocurrido por los mercados. No sale bien parado el gremio."
mas_cierres:
  brillante:
    - "Esta la contarán en la taberna durante años, y cada vez con más enemigos."
    - "Volvieron con la paga y con un hambre de lobo."
  exito:
    - "Nada de heroicidades. Un trabajo limpio y bien pagado."
    - "El cliente pagó lo acordado y todos a cenar."
  parcial:
    - "No salió mal del todo, pero tampoco como para presumir."
    - "Hicieron lo principal y dejaron a medias lo demás."
  fracaso:
    - "Hay días en que más vale no salir de la cama, y este fue uno."
    - "De la paga, ni rastro. Esta noche se cena pan duro."
  desastre:
    - "Esta historia no se va a contar en la taberna."
    - "El viaje de vuelta fue largo y muy silencioso."
revelar:
  - "Por cierto, ahora sabes algo más: {heroe} es {rasgo, minus}."
  - "De este viaje sacas algo en claro: {heroe} es {rasgo, minus}."
  - "Según cuentan los demás, {heroe} es {rasgo, minus}."
  - "En {lugar} quedó bien claro que {heroe} es {rasgo, minus}."
por_objeto:
  - "{heroe} sacó {objeto, minus} y se acabó la discusión."
  - "Sin {objeto, minus}, {heroe} no habría vuelto para contarlo."
  - "{objeto, mayus} le salvó el pellejo a {heroe} en el peor momento."
