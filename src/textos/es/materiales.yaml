hierro:
  nombre: "Hierro"
  de_donde: "Sale limpiando guaridas e investigando."
  usos: "Lo piden las armas, las corazas y las ganzúas (crearlas y mejorarlas)."
cuero:
  nombre: "Cuero"
  de_donde: "Sale cazando y explorando."
  usos: "Lo piden las botas, los escudos y las capas buenas."
tela:
  nombre: "Tela"
  de_donde: "Sale escoltando y recuperando."
  usos: "La piden las capas."
hierbas:
  nombre: "Hierbas"
  de_donde: "Las traen las expediciones al bosque y a las marismas."
  usos: "Las piden las pociones de las expediciones, el saquito de hierbas y la mejora de los amuletos (en la alquimia)."
madera:
  nombre: "Madera buena"
  de_donde: "La traen las expediciones al bosque."
  usos: "La piden el hacha de roble (forja), la varita de cristal y la mejora de las varitas (alquimia)."
cristal:
  nombre: "Cristal"
  de_donde: "Lo traen, raro, las expediciones lejanas a la sierra y a las ruinas."
  usos: "Lo pide la varita de cristal y la obra maestra: mejorar un objeto a +4 en su taller."
