# Asaltos a la taberna (data/raids.ts y core/raids.ts). Huecos: {banda} la banda, {heroe} un
# héroe, {grupo} los defensores. {varios} es «si» cuando la banda va en plural (ver «bandas»):
# con él se elige el verbo («{varios, select, si {vienen} other {viene}}»).

bandas:
  # Las bandas. «varios»: «si» si el nombre va en plural («los Hermanos Cuervo»): cambia el verbo.
  - nombre: "la banda del Tuerto Garra"
    varios: "no"
  - nombre: "los Hermanos Cuervo"
    varios: "si"
  - nombre: "las Ratas del Vado"
    varios: "si"
  - nombre: "la Compañía Sin Bandera"
    varios: "no"
  - nombre: "los Lobos de Hondogrís"
    varios: "si"
  - nombre: "la cuadrilla de Mano Negra"
    varios: "no"
chivatazos:
  - "El tabernero ha oído en la barra que {banda} {varios, select, si {andan} other {anda}} preguntando por El Jarro Partido."
  - "Un buhonero asustado cuenta que {banda} {varios, select, si {acampan} other {acampa}} a dos leguas, y que hablan de tu caja."
  - "Bigotes lleva dos noches bufando a la puerta, y alguien ha pintado en el poste del camino la señal de {banda}."
  - "Una niña del pueblo trae un recado: {banda} {varios, select, si {vienen} other {viene}} a por el gremio."
chivatazo_explorador: "{heroe} ha visto huellas y hogueras en el camino real: {varios, select, si {son} other {es}} {banda}, y vienen hacia aquí."
asalto_empieza:
  - "Pasada la medianoche, una fila de antorchas bajó por el camino real: era {banda}."
  - "Los perros del pueblo ladraron a la vez. Luego se oyeron botas y voces en el patio: {varios, select, si {habían} other {había}} llegado {banda}."
  - "A deshoras, alguien aporreó la puerta con el pomo de una espada. {varios, select, si {Eran} other {Era}} {banda}."
asalto_pelea:
  - "{heroe} salió por la puerta antes que nadie y tumbó a dos antes de que encendieran la segunda antorcha."
  - "{heroe} se plantó junto al pozo y por ahí no pasó nadie."
  - "{heroe} peleó espalda con espalda junto al poste del camino."
  - "Un bandido intentó colarse por la ventana de la sala; {heroe} lo despidió con un taburete."
asalto_ganado:
  - "Al alba, {banda} {varios, select, si {huían} other {huía}} camino abajo. En el patio se dejaron las antorchas y un sombrero de ala ancha."
  - "Los que quedaban en pie salieron corriendo. En el pueblo ya cuentan que en El Jarro Partido no se roba."
asalto_perdido:
  - "Eran demasiados. Se llevaron lo que quisieron y antes del alba ya no estaban."
  - "Cuando por fin se fueron, la caja estaba medio vacía y la puerta, arrancada."
asalto_vacio: "No había nadie en casa para defenderla. El tabernero se escondió en la bodega con Bigotes y oyó cómo vaciaban la caja."
chivatazo_torre: "El vigía de la torre ha visto antorchas en el camino real: es {banda}."
chivatazo: "Chivatazo: {texto} Llegarán en {dias, plural, =0 {una noche} one {una noche} other {unas # noches}}."
titulo: "Asalto de {banda}"
nadie: "nadie"
guardia: "{linea}{rota, select, si { Pero eran muchos: {muchos, select, si {los de guardia cayeron} other {cayó}} y rompieron la puerta.} other {}}"
sin_guardia: "No había nadie de guardia: rompieron la puerta a hachazos y entraron."
salas: "Se peleó en {salas}{hay, select, si {: {grupo} plantaron cara} other {}}."
la_casa: "la casa"
camara_saqueo: "Forzaron la cerradura de la cámara y cargaron los sacos."
camara_nada: "Forzaron la cerradura de la cámara, pero no llegaron a sacar nada de casa."
cerradura: "Llegaron a la cámara, pero la cerradura aguantó lo justo."
chip_recuperado: "Recuperado: {n} monedas que se llevaban"
chip_repelido: "Asalto repelido"
chip_botin: "+{n} monedas de los bandidos"
chip_mas_rep: "+{n} reputación"
chip_menos_rep: "−{n} reputación"
chip_tregua: "Tregua: {n} días"
chip_saqueo: "Saqueo: −{n} monedas"
chip_robado: "Robado: {objeto}"
chip_robado_trofeo: "Robado el trofeo: {trofeo}"
chip_golpes: "{nombre} se llevó unos buenos golpes"
historial: "Día {dia} · Defendió la taberna de {banda}"
aviso_ganado: "¡{banda, mayus} {varios, select, si {asaltaron} other {asaltó}} la taberna y {grupo} {muchos, select, si {los echaron} other {los echó}}!"
aviso_robo: "{banda, mayus} {varios, select, si {asaltaron} other {asaltó}} la taberna y se {varios, select, si {llevaron} other {llevó}} {n} monedas."
aviso_arcon: "{banda, mayus} {varios, select, si {asaltaron} other {asaltó}} la taberna y {varios, select, si {salieron} other {salió}} con lo que {varios, select, si {pudieron} other {pudo}} del arcón."
aviso_barra: "Chivatazo: {banda} {varios, select, si {llegan} other {llega}} {cuando}. Prepara las defensas."
aviso_mapa: "{banda, mayus} {varios, select, si {vienen} other {viene}} hacia la taberna: {varios, select, si {llegan} other {llega}} {cuando}."
# Quien cae en un asalto se salva casi siempre; muy raro, no lo cuenta.
epitafio: "Cayó defendiendo la taberna de {banda} el día {dia}"
chip_caido: "{heroe} no se levanta: ha muerto defendiendo la casa"
