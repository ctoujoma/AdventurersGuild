# Salas: nombres, descripciones y lo que da cada nivel (data/rooms.ts y data/roomInfo.ts).

salas:
  recibidor:
    nombre: "Recibidor"
    desc: "La entrada desde el patio. Aquí se ponen los héroes de guardia."
  salon:
    nombre: "Salón"
    desc: "El corazón de la taberna: aquí comen, beben y pagan los que vienen."
  cocina:
    nombre: "Cocina"
    desc: "Hace la comida para los visitantes y para los nuestros."
  bodega:
    nombre: "Bodega"
    desc: "Hace y guarda la cerveza. Bajo tierra sale mejor."
  tesoro:
    nombre: "Cámara del tesoro"
    desc: "Guarda el oro del gremio. Es lo que buscan los bandidos."
  dormitorio:
    nombre: "Dormitorio"
    desc: "Camas para los héroes."
  enfermeria:
    nombre: "Enfermería"
    desc: "Los heridos se curan antes."
  capilla:
    nombre: "Capilla"
    desc: "Moral para todos y una vela por cada caído."
  mapas:
    nombre: "Sala de mapas"
    desc: "Más encargos en el tablón y, con nivel, el peligro real."
  armeria:
    nombre: "Armería"
    desc: "Equipo para todos los que salen de misión."
  forja:
    nombre: "Forja"
    desc: "Crea armas y armaduras, y templa las del arcón."
  veteranos:
    nombre: "Cuartos de veteranos"
    desc: "Cuartos para los héroes de nivel alto."
  torre:
    nombre: "Torre del vigía"
    desc: "Avisa de los asaltos que vienen."
  servicio:
    nombre: "Dormitorio del servicio"
    desc: "Camas para los trabajadores."
  despensa:
    nombre: "Despensa"
    desc: "Guarda la comida."
  armas:
    nombre: "Sala de armas"
    desc: "Se entrena la Fuerza."
  tiro:
    nombre: "Galería de tiro"
    desc: "Se entrena la Destreza."
  biblioteca:
    nombre: "Biblioteca"
    desc: "Se entrena la Mente."
  sastreria:
    nombre: "Sastrería"
    desc: "Tiñe y viste a los héroes, y crea botas y capas."
  alquimia:
    nombre: "Taller de alquimia"
    desc: "Crea amuletos y varitas."
  pintor:
    nombre: "Taller del pintor"
    desc: "El pintor pinta las salas del color que elijas."
  almacen:
    nombre: "Almacén"
    desc: "Guarda los materiales que traen los encargos: más con cada nivel y cada hueco."
efecto:
  taller_0: "No crea nada"
