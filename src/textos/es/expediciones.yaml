# Expediciones (core/expedition.ts y su interfaz). Huecos de siempre: {heroe} un héroe, {sexo}
# su sexo (f/m), {rumbo} el rumbo (bosque, sierra, marismas, ruinas; para el select), {n} cuántos.

# Los rumbos: el nombre en un hueco, el título de su tarjeta y lo que se cuenta de él.
rumbos:
  bosque:
    nombre: "el bosque"
    titulo: "Bosque"
    desc: "Al este, robles y hayas que se van cerrando. Trae {materiales}; lobos, osos y furtivos."
  sierra:
    nombre: "la sierra"
    titulo: "Sierra"
    desc: "Al norte, nieve y pedreras. Trae {materiales}; lobos, trasgos de las minas y ventiscas."
  marismas:
    nombre: "las marismas"
    titulo: "Marismas"
    desc: "Al suroeste, niebla y juncales. Trae {materiales}; sanguijuelas, ahogados y contrabandistas."
  ruinas:
    nombre: "las ruinas"
    titulo: "Ruinas"
    desc: "Al sureste, piedras viejas y polvo. Trae {materiales}; esqueletos, saqueadores y trampas."

# Por qué no puede salir (la hoja de preparar lo enseña en el botón).
error:
  cerrado: "Ese rumbo se abre al llegar a {dias} días de lejanía en {antes, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}}."
  pociones: "En la alquimia solo hay {n, plural, =0 {ninguna poción hecha} one {# poción hecha} other {# pociones hechas}}."
  cerradas: "Las expediciones se abren con el primer veterano (nivel {nivel})."
  sin_hueco: "La sala de mapas no da para más expediciones a la vez ({n}). Amplíala para mandar más."
  tope: "Con la sala de mapas de ahora van {n, plural, one {# héroe como mucho} other {# héroes como mucho}}. Mejórala para mandar más."
  pocas_raciones: "Hacen falta al menos {n} raciones: un día de ida y la vuelta."
  despensa: "En la despensa solo hay {n, plural, one {# ración} other {# raciones}}."
  sin_suceso: "Ya no hay nada que elegir."
  falta_clase: "Haría falta {clase, select, guerrero {un guerrero} picaro {un pícaro} mago {un mago} clerigo {un clérigo} other {un explorador}} en pie."
  sin_oro: "En la mochila no hay {n} monedas."
  sin_materiales: "No llevan nada que vender."

# El diario de la expedición (se guarda en la partida). Una línea por suceso.
diario:
  asalto_campamento: "De noche, algo se mueve junto al fuego del campamento: ¡{enemigos}! A las armas."
  de_noche:
    - "Aúllan los lobos a lo lejos; {heroe} echa otro leño al fuego."
    - "{heroe} hace la primera guardia, con la espalda contra un tronco."
    - "Algo cruje en la oscuridad, pero no se acerca."
    - "{heroe} cuenta una historia junto al fuego; nadie se la cree."
    - "Las brasas crepitan. Duermen de un tirón."
  pocion_pelea: "Acabada la pelea, {heroe} se bebe una poción de un trago: se tiene en pie."
  herido_leve: "{heroe} va {sexo, select, f {tocada} other {tocado}}: más despacio y con cuidado. Quizá convenga volver."
  nadie: "Nadie estaba en condiciones de ocuparse de {que}: lo dejan pasar."
  pocion_hallada: "{heroe} encuentra una poción entre unas raíces: a la mochila."
  pocion: "{heroe} se bebe una poción de hierbas y se siente mejor: una herida menos."
  record: "{n, plural, one {Llega} other {Llegan}} más lejos que nadie del gremio por {rumbo, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}}: es un récord."
  fardo_queda: "Lo que no pueden cargar queda tirado en un fardo; quizá otra expedición lo encuentre."
  fardo: "¡Un fardo del gremio! Es el que {m, plural, one {perdió {quien}} other {perdieron {quien}}}: {que}."
  paraje_visto: "{n, plural, one {Pasa} other {Pasan}} junto a {que}; el gremio ya entró allí el día {dia}."
  paraje_otra_vez: "{n, plural, one {Da} other {Dan}} con {que} que el gremio vio el día {dia} y dejó sin explorar."
  salida: "{grupo} {n, plural, one {sale} other {salen}} hacia {rumbo, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}} con {raciones} raciones."
  # Al adentrarse (cada pocos días de lejanía): más peligro y mejor botín.
  aviso: "{n, plural, one {Ya lleva} other {Ya llevan}} {dias} días adentro: {rumbo, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}} se vuelve más salvaje. Más peligro, mejor botín."
  raciones: "{heroe} caza algo para la olla: {n, plural, one {# ración más} other {# raciones más}}."
  oro: "{heroe} encuentra una bolsa con {oro} monedas."
  hallazgo: "{heroe} encuentra {que}."
  pelea_bien: "{n, plural, one {{heroe} topa con {enemigos} y sale {sexo, select, f {bien parada} other {bien parado}}} other {Topan con {enemigos}; {heroe} les planta cara y salen bien parados}}.{oro, plural, =0 {} other { Luego {n, plural, one {recoge} other {recogen}} del suelo {oro} monedas.}}"
  pelea_mal: "{n, plural, one {{heroe} topa con {enemigos} y la cosa sale mal: acaba} other {Topan con {enemigos} y la cosa sale mal: {heroe} acaba}} {sexo, select, f {herida} other {herido}}."
  pelea_cae: "{n, plural, one {{heroe} topa con {enemigos} y la cosa sale muy mal: cae} other {Topan con {enemigos} y la cosa sale muy mal: {heroe} cae}} y no puede tenerse en pie."
  cura: "{mismo, select, si {{curandero} se cura sus propias heridas junto al fuego.} other {{curandero} venda las heridas de {heroe} junto al fuego.}}"
  hambre: "No hay raciones para todos: {quien} se {n, plural, one {acuesta} other {acuestan}} sin cenar."
  llegada: "{n, plural, one {Llega} other {Llegan}} a la taberna."
  prudencia: "{guardian, select, si {Nadie dice nada: pelean por su cuenta.} other {Nadie dice nada: {n, plural, one {decide} other {deciden}} con prudencia.}}"
  invitado_se_va: "{heroe} cae en la pelea y, en cuanto puede tenerse en pie, se despide: esto no es para {sexo, select, f {ella} other {él}}."
  guardian_bien: "¡{enemigos, mayus} cae! {heroe} le da el último golpe.{m, plural, =0 {} one { {heridos} acaba con heridas.} other { {heridos} acaban con heridas.}}"
  piel: "{heroe} aprovecha la piel: 2 de cuero."
  tras_pelea: "Después de la pelea, encuentran {que}."
  guardian_botin: "En su guarida encuentran {que}. Y algo más: {objeto}."
  vuelta:
    raciones: "Quedan las raciones justas para volver ({raciones}): {n, plural, one {da} other {dan}} media vuelta."
    jugador: "{n, plural, one {Le llega tu recado: vuelve} other {Les llega tu recado: vuelven}} a casa."
    herido: "Con {heroe} {sexo, select, f {malherida} other {malherido}}, dan media vuelta."
    caidos: "{n, plural, one {{heroe} se arrastra hacia casa como puede} other {No queda nadie en pie. Se arrastran hacia casa como pueden}}; la mayor parte de la mochila se queda allí."
    hambre: "Sin raciones para seguir, {n, plural, one {vuelve} other {vuelven}} a casa."
    guardian: "Mejor no tentar a la suerte: {n, plural, one {da} other {dan}} media vuelta."
  camino:
    bosque:
      - "El sendero se pierde entre robles viejos."
      - "{heroe} jura que algo {n, plural, one {le} other {los}} sigue entre los helechos."
      - "Un ciervo se cruza en el sendero y se queda mirando."
      - "{heroe} encuentra setas; mejor no probarlas."
      - "{heroe} marca los troncos con la navaja para no perderse."
      - "Llueve entre las hojas; {n, plural, one {sigue} other {siguen}} igual, {n, plural, one {{sexo, select, f {calada} other {calado}}} other {calados}}."
      - "Un cuervo {n, plural, one {le} other {los}} acompaña un buen trecho, de rama en rama."
      - "{n, plural, one {Cruza} other {Cruzan}} un arroyo helado por un tronco caído."
    sierra:
      - "El camino se vuelve pedrera; {n, plural, one {sube} other {suben}} con cuidado."
      - "{heroe} señala unas huellas enormes en la nieve."
      - "Un águila da vueltas muy arriba."
      - "{n, plural, one {Encuentra} other {Encuentran}} la boca de una mina abandonada; mejor no entrar a oscuras."
      - "El viento silba entre las peñas."
      - "{heroe} resbala en el hielo, pero no pasa nada."
    marismas:
      - "El agua les llega a las rodillas."
      - "{heroe} se arranca una sanguijuela del brazo."
      - "Las ranas se callan de golpe a su paso."
      - "Una garza levanta el vuelo entre los juncos."
      - "{n, plural, one {Sigue} other {Siguen}} un sendero de tablas medio podridas."
      - "Huele a cieno y a lluvia."
    ruinas:
      - "Columnas rotas asoman entre la arena."
      - "{heroe} encuentra una moneda vieja con una cara que nadie conoce."
      - "Un lagarto toma el sol sobre una estatua sin cabeza."
      - "{heroe} pisa una losa que suena hueca; mejor rodear."
      - "Restos de un mosaico: un dragón, o eso parece."
      - "El polvo se levanta en remolinos."
  # La noche en el campamento (una línea cada noche).
  noche:
    bosque: "{n, plural, one {Acampa} other {Acampan}} bajo los árboles{vuelta, select, si {, ya de vuelta} other {}}. Quedan {raciones, plural, =0 {cero raciones} one {# ración} other {# raciones}}."
    sierra: "{n, plural, one {Acampa} other {Acampan}} al abrigo de una peña{vuelta, select, si {, ya de vuelta} other {}}. Quedan {raciones, plural, =0 {cero raciones} one {# ración} other {# raciones}}."
    marismas: "{n, plural, one {Acampa} other {Acampan}} en un islote seco{vuelta, select, si {, ya de vuelta} other {}}. Quedan {raciones, plural, =0 {cero raciones} one {# ración} other {# raciones}}."
    ruinas: "{n, plural, one {Acampa} other {Acampan}} entre muros viejos{vuelta, select, si {, ya de vuelta} other {}}. Quedan {raciones, plural, =0 {cero raciones} one {# ración} other {# raciones}}."
  nieve: "La nieve aprieta: gastan {m, plural, one {una ración más} other {# raciones más}} para calentarse."
  # El tiempo, al cambiar (bloque 5).
  tiempo:
    claro: "Escampa: el día se queda claro."
    lluvia: "Empieza a llover: el camino se vuelve barro y van más despacio."
    niebla: "Baja la niebla: no se ve a diez pasos."
    nieve: "Empieza a nevar."
    viento: "Se levanta un viento helado que les frena."
    polvo: "El viento levanta polvo: cuesta ver lo que hay delante."
    tormenta: "Llega una tormenta seca: rayos sin lluvia y polvo por todas partes."

# Contra qué pelean, por rumbo (en un hueco: «Topan con {enemigos}»).
enemigos:
  bosque:
    - "una manada de lobos"
    - "un jabalí"
    - "un oso"
    - "un lobo enorme"
  sierra:
    - "una manada de lobos grises"
    - "una partida de trasgos"
    - "un oso pardo"
    - "un gigante de las nieves"
  marismas:
    - "sanguijuelas enormes"
    - "un ahogado"
    - "unos contrabandistas"
    - "una culebra de agua"
  ruinas:
    - "unos esqueletos"
    - "unos saqueadores"
    - "ratas del tamaño de perros"
    - "un gólem de piedra"

# El guardián de cada rumbo (raro y lejos), en un hueco como los enemigos.
guardianes:
  bosque: "el Viejo Colmillo"
  bosque_2: "el Viejo Jabalí"
  sierra: "la Sierpe Blanca"
  marismas: "la Reina del Juncal"
  ruinas: "la Dragona de Ceniza"

# La pelea, para verla luego: el nombre de arriba y dónde fue.
pelea:
  nombre: "{enemigos, mayus}"
  donde: "En {rumbo, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}}, a {dias, plural, =0 {menos de un día} one {un día} other {# días}} de casa"

# Lo que encuentran en un suceso (en el hueco {que}).
monedas: "{n, plural, one {una moneda} other {# monedas}}"
botin: "{oro, plural, =0 {} one {una moneda y } other {# monedas y }}{que}"

# El informe al volver.
informe:
  chip_abierto: "¡Nuevo rumbo: {rumbo, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}}!"
  chip_pociones: "{n, plural, one {Sobra una poción: vuelve} other {Sobran # pociones: vuelven}} a la alquimia"
  titulo: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}"
  cuerpo: "{dias, plural, one {Un día fuera} other {# días fuera}}: {n, plural, one {llegó} other {llegaron}} a {lejos, plural, =0 {menos de un día} one {un día} other {# días}} de la taberna."
  peleas: "{ganadas, plural, =0 {Ninguna pelea ganada} one {Una pelea ganada} other {# peleas ganadas}} y {perdidas, plural, =0 {ninguna perdida} one {una perdida} other {# perdidas}}."
  sin_peleas: "No {n, plural, one {tuvo} other {tuvieron}} que pelear."
  historial: "Día {dia}: expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}} ({dias, plural, one {# día} other {# días}})."
  epitafio: "Cayó en la expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}, el día {dia}."
  chip_oro: "+{n} monedas"
  chip_materiales: "+{que}"
  chip_raciones: "+{n, plural, one {# ración} other {# raciones}} sobrantes"
  chip_xp: "+{n} de experiencia cada uno"
  chip_record: "¡Récord del rumbo: {dias} días!"
  chip_herido: "{heroe}, {sexo, select, f {herida} other {herido}} ({dias} d)"
  chip_caido: "{heroe} no ha vuelto"
  chip_perdido: "Perdido: {objeto}"
  chip_objeto: "Traen: {objeto}"
  chip_invitado: "{heroe} quiere quedarse: espera en la barra"

aviso:
  abierto: "¡Se abre {rumbo, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}}! Ya se pueden mandar expediciones."
  herido: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}: {heroe} va {sexo, select, f {herida} other {herido}}. Quizá convenga mandarles volver."
  brillo: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}: {brillo, select, 3 {¡algo legendario!} other {¡algo raro!}} {que}"
  fardo: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}: ¡encuentran el fardo que {m, plural, one {perdió {quien}} other {perdieron {quien}}}!"
  suceso: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}: {que, mayus}. Esperan a que digas."
  guardian: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}: ¡{que}! Abre el visor para verlo."
  vuelve: "Vuelve la expedición {rumbo, select, bosque {del bosque} sierra {de la sierra} marismas {de las marismas} other {de las ruinas}}: {grupo}."

