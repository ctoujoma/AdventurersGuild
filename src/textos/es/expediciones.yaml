expeditionsheet:
  pocion_a: "Poción para {heroe} ({pct} %)"
  cerrado: "Llega a {dias} días en {antes, select, bosque {el bosque} sierra {la sierra} marismas {las marismas} other {las ruinas}} (récord: {record})"
  pociones: "Pociones"
  pociones_ayuda: "de {n} hechas en la alquimia"
