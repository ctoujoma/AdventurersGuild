# La lista de grupos fuera, en el mapa (ui/panels/MapPanel.tsx).
mappanel:
  ver: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}} con {quien}: ver"
  estado: "{vuelta, select, si {De vuelta} other {Adentrándose}} · a {dias, plural, =0 {menos de un día} one {# día} other {# días}} · {raciones, plural, one {# ración} other {# raciones}}"
  sin_hueco: "Expediciones a la vez: {n} (amplía la sala de mapas)"
  nueva: "Nueva expedición"
  espera: "{que, mayus}: esperan a que digas"

# Los sucesos con decisión (data/expEvents.ts). «titulo»: la cabecera de la carta; «texto»: lo
# que pasa (va al diario); cada opción con su «nombre» (el botón) y lo que sale, «bien» o «mal».
# Huecos: {heroe} quien lo hace, {sexo} su sexo, {n} cuántos van, {que} el botín, {objeto} un
# objeto encontrado ({con_objeto} si lo hay), {oro} monedas, {m} cuántos.
sucesos:
  cofre:
    titulo: "un cofre medio enterrado"
    texto: "Entre las raíces asoma un cofre medio enterrado, con un candado oxidado."
    forzar:
      nombre: "Forzarlo"
      bien: "{heroe} revienta el candado a golpes. Dentro: {que}.{con_objeto, select, si { Y {objeto}.} other {}}"
      mal: "{heroe} fuerza la tapa y salta una trampa de aguja: {sexo, select, f {herida} other {herido}}, y el cofre, vacío."
    ganzua:
      nombre: "Abrirlo con ganzúa"
      bien: "{heroe} abre el candado sin un ruido. Dentro: {que}.{con_objeto, select, si { Y {objeto}.} other {}}"
      mal: "La ganzúa se parte y salta la trampa: {heroe} acaba con la mano hinchada."
    dejar:
      nombre: "Dejarlo"
      bien: "Mejor no tocar lo que otro ha enterrado. Siguen."
  santuario:
    titulo: "un santuario en el camino"
    texto: "Un santuario de piedra cubierto de musgo, con velas que alguien ha encendido hace poco."
    rezar:
      nombre: "Rezar"
      bien: "{heroe} reza en voz baja y todos se sienten mejor: cada uno cura una herida."
    ofrenda:
      nombre: "Dejar una ofrenda"
      bien: "Dejan {oro} monedas en el cuenco.{curado, select, si { Las heridas escuecen menos.} other { No pasa nada, pero se quedan más tranquilos.}}"
    seguir:
      nombre: "Seguir"
      bien: "Pasan de largo con respeto."
  mercader:
    titulo: "un mercader de camino"
    texto: "Un mercader con su mula les sale al paso: vende pan duro y compra lo que sea."
    comprar:
      nombre: "Comprar raciones"
      bien: "Compran {m, plural, one {una ración} other {# raciones}} por {oro} monedas."
    vender:
      nombre: "Vender lo que llevan"
      bien: "Le venden {m} cosas de la mochila por {oro} monedas."
    seguir:
      nombre: "Seguir"
      bien: "No hacen tratos y siguen."
  viajero:
    titulo: "un viajero solitario"
    texto: "Un viajero con capa raída pide ir con ellos un trecho: dice que sabe manejar la espada."
    unirse:
      nombre: "Que venga"
      bien: "{otro} se une al grupo. Parece {otro_sexo, select, f {de fiar} other {de fiar}}."
      mal: "Por la noche el viajero desaparece con {oro, plural, =0 {nada: no había qué robar} other {# monedas de la mochila}}."
    calar:
      nombre: "Que lo cale el clérigo"
      bien: "{heroe} le mira a los ojos y le deja venir. Resulta ser {otro}, y es de fiar."
      mal: "{heroe} no se fía ni un pelo y le despide. Mejor así."
    seguir:
      nombre: "Despedirle"
      bien: "Le desean buen camino y siguen."
  campamento:
    titulo: "un campamento abandonado"
    texto: "Brasas frías, una tienda rota y fardos tirados: alguien se fue de aquí con prisa."
    registrar:
      nombre: "Registrarlo"
      bien: "Recogen {m, plural, one {una ración} other {# raciones}}; además, {que}."
      mal: "Mientras registran, vuelve lo que espantó a los dueños."
    rastrear:
      nombre: "Rastrear quién lo dejó"
      bien: "{heroe} lee las huellas: se fueron sin peligro. Recogen {m, plural, one {una ración} other {# raciones}}."
    seguir:
      nombre: "Seguir"
      bien: "Ni lo tocan: algo espantó a los dueños."
  oso:
    titulo: "un oso en el sendero"
    texto: "Un oso enorme les corta el paso y se levanta sobre las patas de atrás."
    plantar:
      nombre: "Plantarle cara"
      bien: "{heroe} da un paso al frente con el arma en alto."
    rodear:
      nombre: "Rodearlo sin ruido"
      bien: "{heroe} los guía por un rodeo entre las zarzas: el oso ni se entera."
      mal: "Cruje una rama y el oso se da la vuelta."
    retroceder:
      nombre: "Retroceder y esperar"
      bien: "Se retiran despacio y esperan a que se vaya: pierden unas horas."
  cueva:
    titulo: "una cueva"
    texto: "La boca de una cueva entre las rocas; dentro se oye agua y algo más."
    entrar:
      nombre: "Entrar"
      bien: "Dentro, en un rincón seco, encuentran {que}.{con_objeto, select, si { Y {objeto}.} other {}}"
      mal: "No están solos en la cueva."
    cuidado:
      nombre: "Entrar con cuidado"
      bien: "{heroe} va delante, tanteando: encuentran {que} sin despertar a nadie."
      mal: "{heroe} oye algo al fondo y salen sin nada. Mejor así."
    seguir:
      nombre: "Seguir de largo"
      bien: "Dejan la cueva atrás; quizá otra vez."
  torre:
    titulo: "una atalaya abandonada"
    texto: "Una atalaya de piedra, medio derruida, con la puerta atrancada."
    subir:
      nombre: "Trepar por fuera"
      bien: "{heroe} trepa por las piedras y entra por una ventana. Arriba: {que}."
      mal: "{heroe} resbala a media subida y cae: {sexo, select, f {herida} other {herido}}."
    cerradura:
      nombre: "Abrir la puerta"
      bien: "{heroe} abre la puerta sin romperla. Dentro: {que}.{con_objeto, select, si { Y {objeto}.} other {}}"
      mal: "La cerradura no cede. Lo dejan."
    seguir:
      nombre: "Seguir"
      bien: "Siguen; la atalaya se queda mirándolos."
  ruinas:
    titulo: "unas ruinas con runas"
    texto: "Piedras viejas cubiertas de hiedra y una puerta sellada con runas que aún brillan."
    runas:
      nombre: "Leer las runas"
      bien: "{heroe} lee las runas en voz alta y la puerta se abre: dentro, 2 de cristal.{con_objeto, select, si { Y {objeto}.} other {}}"
      mal: "Las runas estallan en las manos de {heroe}: {sexo, select, f {herida} other {herido}}."
    forzar:
      nombre: "Forzar la puerta"
      bien: "{heroe} empuja la puerta y algo despierta dentro."
    seguir:
      nombre: "No tocarlas"
      bien: "Hay cosas que es mejor no abrir. Siguen."
  guardian:
    titulo: "el guardián del rumbo"
    texto: "{rumbo, select, bosque {Tiembla el suelo: el Viejo Colmillo, el lobo enorme que guarda lo más hondo del bosque, les cierra el paso.} sierra {Cruje la nieve: la Sierpe Blanca, que duerme en los ventisqueros, se desenrosca ante ellos.} marismas {Se abren los juncos: la Reina del Juncal sale del agua negra y les cierra el paso.} other {Se levanta una nube de ceniza: la Dragona de Ceniza despierta entre las columnas rotas.}}"
    texto_2: "{rumbo, select, bosque {Crujen las ramas y el suelo retumba: el Viejo Jabalí, más grande que un carro y con los colmillos llenos de cicatrices, sale de la espesura.} other {Algo aún más grande les cierra el paso.}}"
    pelear:
      nombre: "Pelear en directo"
      bien: "{heroe} grita y cargan contra el guardián."
    solos:
      nombre: "Que peleen solos"
      bien: "Cargan contra el guardián por su cuenta."
    escapar:
      nombre: "Escabullirse y volver"
      bien: "{heroe} les guía entre las sombras: {enemigos} ni se entera, y dan media vuelta."
      mal: "{enemigos, mayus} les huele al escabullirse: {herido} se lleva un buen golpe antes de huir."
  jefe:
    titulo: "algo grande a la vista"
    texto: "A lo lejos, {enemigos}. {n, plural, one {Se para} other {Se paran}} a mirar, sin hacer ruido, y {n, plural, one {espera} other {esperan}} a que digas."
    pelear:
      nombre: "Pelear en directo"
      bien: "Van a por {enemigos}."
    solos:
      nombre: "Que peleen solos"
      bien: "Van a por {enemigos} por su cuenta."
    escapar:
      nombre: "Intentar rodearlo"
      bien: "{heroe} encuentra un rodeo: {enemigos} se queda atrás sin verles."
      mal: "Cruje una rama: {enemigos} se les echa encima y {herido} se lleva un buen golpe antes de escapar."

