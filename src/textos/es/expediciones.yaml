# Cuando se abren (bloque 5): la carta del veterano y el tutorial corto (ui/ExpIntro.tsx).
veterano:
  titulo: "Una carta del veterano"
  cabecera: "¡Expediciones!"
  carta: "{heroe} deja una carta en la barra: «Ya conozco cada camino de la comarca. Más allá de la niebla hay bosques que nadie ha pisado, sierras, marismas y ruinas viejas. Dadme raciones y un par de compañeros, y os traeré lo que no traen los encargos: madera buena, hierbas, cristal… y algo de gloria.»"
  carta2: "Con la sala de mapas se pueden mandar expediciones: cada día más lejos, con más peligro y mejor botín. Vuelven solas cuando les quedan las raciones justas."
  chip: "Expediciones abiertas: en el mapa"
  aviso: "{heroe} propone ir más allá de la comarca: ¡se abren las expediciones!"
intro:
  titulo: "Expediciones"
  siguiente: "Siguiente"
  vamos: "Al mapa"
  cerrar: "Cerrar"
  paso: "{n} de {total}"
  p1_titulo: "Elige quién va y hacia dónde"
  p1_texto: "En el mapa, «Nueva expedición». La sala de mapas dice cuántos van. Cada rumbo trae lo suyo: madera y hierbas en el bosque, hierro y cristal en la sierra, hierbas y cuero en las marismas, cristal y objetos en las ruinas."
  p2_titulo: "Raciones: cuánto duran"
  p2_texto: "Una ración por héroe y día. Cuantas más lleven, más lejos llegan: más peligro y mejor botín. La vuelta tarda la mitad. Si la alquimia ha hecho pociones, llévales alguna."
  p3_titulo: "Síguelos en el visor"
  p3_texto: "Toca su ficha para verlos andar, pelear y acampar. A veces te preguntan qué hacer: contesta antes de la noche o eligen ellos con prudencia. Vuelven solos, o cuando les digas."

