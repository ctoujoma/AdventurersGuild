  pocion_a: "Darle una poción a {heroe}"
  tiempo:
    lluvia: "Lluvia: más despacio"
    niebla: "Niebla: emboscadas, peor pista"
    nieve: "Nieve: más raciones"
    viento: "Viento: más despacio"
    polvo: "Polvo: peor pista"
    tormenta: "Tormenta seca: despacio, peor pista"
  titulo: "Expedición {rumbo, select, bosque {al bosque} sierra {a la sierra} marismas {a las marismas} other {a las ruinas}}"
  cerrar: "Cerrar"
  ahora:
    wait: "El grupo, parado, esperando a que digas"
    walk: "El grupo, {vuelta, select, si {de vuelta a casa} other {adentrándose}}"
