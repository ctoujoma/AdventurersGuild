mascota:
  gato:
    - "Whiskers purrs. He's been here longer than you."
    - "Whiskers opens one eye, looks at you and closes it again."
    - "Whiskers lets you scratch behind his ear. Just a little."
    - "Whiskers headbutts your hand. He smells of the kitchen."
    - "Whiskers stretches out by the fire. The spot is his."
  perro:
    - "Woof, woof! Ember wags his tail and lies back down."
    - "Ember licks your hand and sighs."
    - "Ember barks at the door. Nobody there… for now."
    - "Ember rolls belly up. Some guard dog."
    - "Ember pricks up his ears: he heard something in the yard."
  cuervo:
    - "Caw, caw! Coal says he brings news, but won't let anything slip."
    - "Coal eyes you sideways and preens a feather."
    - "Coal tilts his head: he expects something shiny in return."
    - "Coal croaks your name. Or something like it."
    - "Coal doesn't trust strangers. You, halfway."
  rata:
    - "A rat. It came out of the hole in the floor and that's where it goes back."
    - "The rat looks at you, thinks it over and bolts."
    - "Until the room is repaired, the rats are in charge here."
    - "Whiskers should deal with this. Whiskers disagrees."
  murcielago:
    - "The bats scatter and hang themselves back on the beams."
    - "Bats in the ceiling. With the room repaired, they'd find another home."
    - "A flutter, a squeak and still again, upside down."
premio:
  jardineras: "window boxes for the facade"
