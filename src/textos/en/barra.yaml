tips:
  el_tablon_de_encargos: "The quest board is in the hall: tap the room and open it. Tap a quest, choose who to send and check the risk. Better “Likely” than “Suicidal”."
  cuando_un_grupo_se: "When a party leaves, it takes a few days to return. In the morning its report arrives at the bell up top."
  cada_grupo_que_vuelve: "Every party that returns sends its report (the envelope below). Read it: that's where you see what each of them is made of."
  en_la_barra_hay: "At the bar there are people looking for work. You won't get anywhere with two heroes, so hire someone. Check the signing fee and the wage, which is paid every week."
  el_dia_viene_merlo: "On day {dia} Merlo comes to collect {cantidad} gold, plus wages. What's due is shown up top, on the scroll. If you can't pay, he takes the tavern, cat included."
  cuando_tengas_algo_ahorrado: "Once you have some savings, fix up the house from “Guild”. More beds, an infirmary, a tavern that makes money. Everything has a use and shows in the house."
  remedios_cocina_tobias_atiende: "Remedios cooks, Tobías serves the hall and Nico brings up the barrels from the cellar. They come from the village every morning and are paid with the heroes. Tap a room to see who works in it. To move someone, grab them with your finger and drop them in another room; heroes who stay at home can lend a hand too."
  alguien_anda_desanimado_y: "Someone is feeling down and performing worse. Let them rest at the tavern for a few days, or raise their wage if they ask. Whoever is fed up may leave any night."
  el_equipo_que_traen: "Gear that parties bring back is kept in the armoury (in chests, while it's broken). Give it to someone from their sheet. But beware: if they fall on a quest, the item is lost with them."
  los_trofeos_se_cuelgan: "Trophies are hung in the hall. People come to see them, have a drink, and that means gold every day."
  si_has_pagado_a: "If you've paid Merlo, the house is all yours and the patching-up is over: now it's time for real building work. Tap the hammer on the right for building mode: below you pick a new room and then where it goes. If you tap a room, you can expand, move or demolish it."
  en_el_modo_obras: "In building mode everything is make-believe until you pay: you see how it looks and what it costs. You can leave a room cut off for a moment while moving others; it just has to be fixed before paying. If you don't like it, exit and you won't lose a coin."
  debajo_del_sotano_hay: "Below the basement there's rock. In building mode the slots you can dig are marked with their price: tap them and that's it. The deeper, the pricier. You can also go up, but each floor can only overhang the one below by one slot."
  ahora_viene_gente_del: "Now villagers come asking for work: you'll see them in “Heroes”, “Bar” tab. But each new one needs a bed, so first build the staff quarters."
  la_caja_la_llenan: "The till is filled by those who come to the hall: peasants, merchants and, if the hall looks good, the odd noble who brings fame. The more Appeal (decoration, facade, trophies), the more people; but if nobody tends the bar, they leave without paying. Watch out for strangers who look around too much."
  lo_que_hace_remedios: "What Remedios makes in the kitchen and Nico in the cellar is added up at night, and shown up top: the bread is rations and the jug is beer. Visitors eat and drink from there, and the household has supper before bed. If it's not enough, put someone else in the kitchen or repair it; whoever goes to bed hungry wakes up grumpy."
  ya_tienes_donde_entrenar: "You now have somewhere to train. Grab a hero who's at home and drop them in the room: the bar over their head shows how far they are from the next point. Each room has a cap; upgrading it lets them go further."
  todo_el_oro_se: "All the gold is kept in the treasure vault, and it's almost full: whatever's left over will be lost. Upgrade it (or, once you can build, make it bigger). Its level is also the lock the bandits would have to pick."
