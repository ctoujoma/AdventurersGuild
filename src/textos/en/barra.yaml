  el_reloj_del_dia: "The day clock runs on its own and night falls on its own. With the game closed the tavern carries on at one game day per real day (up to {dias} days), and when you come back it tells you what happened."
  el_reloj_del_dia_2: "The day clock runs on its own. While you're paying off the debt you can speed it up: tap to change the speed."
