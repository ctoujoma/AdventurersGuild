  un_forastero_encapuchado_espera: "A hooded stranger waits by the fire: he offers to bring back one of the fallen. He'll leave {hoy, select, si {today} other {tomorrow}} at noon."
  da_vueltas_en_la: "{nombre} is tossing in bed, plagued by nightmares. Tap them to bring a drink from the cellar."
  terminada_la_obra_de: "Work on {job_room_name} is finished! It's up and running."
