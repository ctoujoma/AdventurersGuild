salas:
  recibidor:
    nombre: "Entrance hall"
    desc: "The way in from the yard. Heroes on guard stand here."
  salon:
    nombre: "Hall"
    desc: "The heart of the tavern: here visitors eat, drink and pay."
  cocina:
    nombre: "Kitchen"
    desc: "Makes food for visitors and for our own."
  bodega:
    nombre: "Cellar"
    desc: "Brews and stores the beer. It comes out better underground."
  tesoro:
    nombre: "Treasure vault"
    desc: "Holds the guild's gold. It's what the bandits are after."
  dormitorio:
    nombre: "Dormitory"
    desc: "Beds for the heroes."
  enfermeria:
    nombre: "Infirmary"
    desc: "The wounded heal sooner."
  capilla:
    nombre: "Chapel"
    desc: "Morale for everyone and a candle for each of the fallen."
  mapas:
    nombre: "Map room"
    desc: "More quests on the board and, with levels, the real danger."
  armeria:
    nombre: "Armoury"
    desc: "Gear for everyone who goes out on a quest."
  forja:
    nombre: "Forge"
    desc: "Makes weapons and armour, and tempers those in the chest."
  veteranos:
    nombre: "Veterans' quarters"
    desc: "Rooms for high-level heroes."
  torre:
    nombre: "Watchtower"
    desc: "Warns of incoming raids."
  servicio:
    nombre: "Staff quarters"
    desc: "Beds for the workers."
  despensa:
    nombre: "Pantry"
    desc: "Stores the food."
  armas:
    nombre: "Weapons room"
    desc: "Trains Strength."
  tiro:
    nombre: "Shooting gallery"
    desc: "Trains Dexterity."
  biblioteca:
    nombre: "Library"
    desc: "Trains Mind."
  sastreria:
    nombre: "Tailor's"
    desc: "Dyes and dresses the heroes, and makes boots and cloaks."
  alquimia:
    nombre: "Alchemy workshop"
    desc: "Makes amulets and wands."
  pintor:
    nombre: "Painter's workshop"
    desc: "The painter paints the rooms whatever colour you choose."
  almacen:
    nombre: "Storeroom"
    desc: "Stores the materials quests bring: more with each level and each slot."
