sucesos:
  cofre:
    titulo: "a half-buried chest"
    texto: "Among the roots, a half-buried chest peeks out, with a rusty padlock."
    forzar:
      nombre: "Force it"
      bien: "{heroe} smashes the padlock. Inside: {que}.{con_objeto, select, si { And {objeto}.} other {}}"
      mal: "{heroe} forces the lid and a needle trap springs: hurt, and the chest is empty."
    ganzua:
      nombre: "Pick the lock"
      bien: "{heroe} opens the padlock without a sound. Inside: {que}.{con_objeto, select, si { And {objeto}.} other {}}"
      mal: "The pick snaps and the trap springs: {heroe} ends up with a swollen hand."
    dejar:
      nombre: "Leave it"
      bien: "Better not to touch what someone else buried. They move on."
  santuario:
    titulo: "a wayside shrine"
    texto: "A moss-covered stone shrine, with candles someone lit not long ago."
    rezar:
      nombre: "Pray"
      bien: "{heroe} prays quietly and everyone feels better: each heals one wound."
    ofrenda:
      nombre: "Leave an offering"
      bien: "They leave {oro} coins in the bowl.{curado, select, si { The wounds sting less.} other { Nothing happens, but they feel calmer.}}"
    seguir:
      nombre: "Move on"
      bien: "They pass by respectfully."
  mercader:
    titulo: "a travelling merchant"
    texto: "A merchant with a mule stops them: selling stale bread and buying anything."
    comprar:
      nombre: "Buy rations"
      bien: "They buy {m, plural, one {one ration} other {# rations}} for {oro} coins."
    vender:
      nombre: "Sell what they carry"
      bien: "They sell {m} things from the pack for {oro} coins."
    seguir:
      nombre: "Move on"
      bien: "No deals today; they move on."
  viajero:
    titulo: "a lone traveller"
    texto: "A traveller in a ragged cloak asks to walk with them a while: says they can handle a sword."
    unirse:
      nombre: "Let them come"
      bien: "{otro} joins the group. Seems {otro_sexo, select, f {trustworthy} other {trustworthy}}."
      mal: "During the night the traveller vanishes with {oro, plural, =0 {nothing: there was nothing to steal} other {# coins from the pack}}."
    calar:
      nombre: "Let the cleric size them up"
      bien: "{heroe} looks them in the eye and lets them come. It's {otro}, and they can be trusted."
      mal: "{heroe} doesn't trust them one bit and sends them off. Just as well."
    seguir:
      nombre: "Send them off"
      bien: "They wish them a good road and move on."
  campamento:
    titulo: "an abandoned camp"
    texto: "Cold embers, a torn tent and scattered bundles: someone left in a hurry."
    registrar:
      nombre: "Search it"
      bien: "They gather {m, plural, one {one ration} other {# rations}}; also, {que}."
      mal: "While they search, whatever scared off the owners comes back."
    rastrear:
      nombre: "Track who left it"
      bien: "{heroe} reads the tracks: they left in no danger. They gather {m, plural, one {one ration} other {# rations}}."
    seguir:
      nombre: "Move on"
      bien: "They don't touch it: something scared off the owners."
  oso:
    titulo: "a bear on the trail"
    texto: "A huge bear blocks the way and rears up on its hind legs."
    plantar:
      nombre: "Stand up to it"
      bien: "{heroe} steps forward, weapon raised."
    rodear:
      nombre: "Go around quietly"
      bien: "{heroe} leads them on a detour through the brambles: the bear never notices."
      mal: "A branch snaps and the bear turns around."
    retroceder:
      nombre: "Back off and wait"
      bien: "They back away slowly and wait for it to leave: they lose a few hours."
  cueva:
    titulo: "a cave"
    texto: "A cave mouth among the rocks; inside, water drips, and something else."
    entrar:
      nombre: "Go in"
      bien: "Inside, in a dry corner, they find {que}.{con_objeto, select, si { And {objeto}.} other {}}"
      mal: "They're not alone in the cave."
    cuidado:
      nombre: "Go in carefully"
      bien: "{heroe} goes first, feeling the way: they find {que} without waking anything."
      mal: "{heroe} hears something at the back and they leave empty-handed. Just as well."
    seguir:
      nombre: "Pass it by"
      bien: "They leave the cave behind; maybe another time."
  torre:
    titulo: "an abandoned watchtower"
    texto: "A half-ruined stone watchtower, its door barred."
    subir:
      nombre: "Climb the outside"
      bien: "{heroe} climbs the stones and gets in through a window. Up top: {que}."
      mal: "{heroe} slips halfway up and falls: hurt."
    cerradura:
      nombre: "Open the door"
      bien: "{heroe} opens the door without breaking it. Inside: {que}.{con_objeto, select, si { And {objeto}.} other {}}"
      mal: "The lock won't give. They leave it."
    seguir:
      nombre: "Move on"
      bien: "They move on; the watchtower watches them go."
  ruinas:
    titulo: "ruins with runes"
    texto: "Old ivy-covered stones and a door sealed with runes that still glow."
    runas:
      nombre: "Read the runes"
      bien: "{heroe} reads the runes aloud and the door opens: inside, 2 crystal.{con_objeto, select, si { And {objeto}.} other {}}"
      mal: "The runes burst in {heroe}'s hands: hurt."
    forzar:
      nombre: "Force the door"
      bien: "{heroe} pushes the door and something wakes inside."
    seguir:
      nombre: "Leave them be"
      bien: "Some things are better left shut. They move on."
  guardian:
    titulo: "the guardian of this heading"
    texto: "{rumbo, select, bosque {The ground shakes: Old Tusk, the huge wolf that guards the deepest forest, blocks their way.} sierra {The snow creaks: the White Serpent, asleep in the drifts, uncoils before them.} marismas {The reeds part: the Reed Queen rises from the black water and blocks their way.} other {A cloud of ash rises: the Ash Dragon wakes among the broken columns.}}"
    texto_2: "{rumbo, select, bosque {Branches snap and the ground rumbles: the Old Boar, bigger than a cart and with scarred tusks, comes out of the thicket.} marismas {The black water boils and a bell tolls beneath the reeds: the Drowned King rises with his anchor and his crown, and two drowned men crawl out of the mud beside him.} other {Something even bigger blocks their way.}}"
    pelear:
      nombre: "Fight it live"
      bien: "{heroe} shouts and they charge at the guardian."
    solos:
      nombre: "Let them fight on their own"
      bien: "They charge at the guardian on their own."
    escapar:
      nombre: "Sneak away and turn back"
      bien: "{heroe} leads them through the shadows: {enemigos} never notices, and they turn back."
      mal: "{enemigos, mayus} catches their scent as they slip away: {herido} takes a heavy blow before they flee."
  jefe:
    titulo: "something big up ahead"
    texto: "In the distance: {enemigos}. {n, plural, one {Stops} other {They stop}} to watch, quietly, and {n, plural, one {waits} other {wait}} for your word."
    pelear:
      nombre: "Fight it live"
      bien: "They go after {enemigos}."
    solos:
      nombre: "Let them fight on their own"
      bien: "They go after {enemigos} on their own."
    escapar:
      nombre: "Try to go around it"
      bien: "{heroe} finds a way around: {enemigos} is left behind without seeing them."
      mal: "A branch snaps: {enemigos} is on them, and {herido} takes a heavy blow before they get away."
