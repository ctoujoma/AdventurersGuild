  raciones: "{heroe} catches something for the pot: {n, plural, one {# more ration} other {# more rations}}."
  oro: "{heroe} finds a purse with {oro} coins."
  hallazgo: "{heroe} finds {que}."
  pelea_bien: "{n, plural, one {{heroe} runs into {enemigos} and comes out fine} other {They run into {enemigos}; {heroe} stands up to them and they come out fine}}.{oro, plural, =0 {} other { Afterwards {n, plural, one {picks} other {they pick}} up {oro} coins from the ground.}}"
  pelea_mal: "{n, plural, one {{heroe} runs into {enemigos} and it goes badly: ends up} other {They run into {enemigos} and it goes badly: {heroe} ends up}} {sexo, select, f {hurt} other {hurt}}."
  pelea_cae: "{n, plural, one {{heroe} runs into {enemigos} and it goes very badly: falls} other {They run into {enemigos} and it goes very badly: {heroe} falls}} and can't stand up."
  cura: "{mismo, select, si {{curandero} tends to their own wounds by the fire.} other {{curandero} bandages {heroe}'s wounds by the fire.}}"
  hambre: "There aren't rations for everyone: {quien} {n, plural, one {goes} other {go}} to bed hungry."
  llegada: "{n, plural, one {Arrives} other {They arrive}} at the tavern."
  prudencia: "{guardian, select, si {No one says a word, and the guardian won't wait any longer.} other {No one says a word: {n, plural, one {plays it safe} other {they play it safe}}.}}"
  invitado_se_va: "{heroe} falls in the fight and, as soon as {sexo, select, f {she} other {he}} can stand, says goodbye: this isn't for {sexo, select, f {her} other {him}}."
  guardian_bien: "{enemigos, mayus} falls! {heroe} lands the final blow.{m, plural, =0 {} one { {heridos} ends up hurt.} other { {heridos} end up hurt.}}"
  piel: "{heroe} takes the hide: 2 leather."
  tras_pelea: "After the fight, they find {que}."
  guardian_botin: "In its lair they find {que}. And something else: {objeto}."
  vuelta:
    raciones: "Just enough rations left to get back ({raciones}): {n, plural, one {turns} other {they turn}} back."
    jugador: "Your message reaches {n, plural, one {them} other {them}}: heading home."
    herido: "With {heroe} {sexo, select, f {badly hurt} other {badly hurt}}, they turn back."
    caidos: "{n, plural, one {{heroe} crawls home as best they can} other {No one is left standing. They crawl home as best they can}}; most of the pack stays behind."
    hambre: "Out of rations, {n, plural, one {heads} other {they head}} home."
    guardian: "Better not to push their luck: {n, plural, one {turns} other {they turn}} back."
  camino:
    bosque:
      - "The trail gets lost among old oaks."
      - "{heroe} swears something is following {n, plural, one {them} other {them}} through the ferns."
      - "A deer crosses the trail and stands there staring."
      - "{heroe} finds mushrooms; better not to try them."
      - "{heroe} notches the trunks with a knife so as not to get lost."
      - "Rain drips through the leaves; {n, plural, one {keeps} other {they keep}} going anyway, {n, plural, one {{sexo, select, f {soaked} other {soaked}}} other {soaked}}."
      - "A crow follows {n, plural, one {them} other {them}} a long way, from branch to branch."
      - "{n, plural, one {Crosses} other {They cross}} a freezing stream on a fallen log."
  noche:
    bosque: "{n, plural, one {Camps} other {They camp}} under the trees{vuelta, select, si {, on the way back} other {}}. {raciones, plural, =0 {No rations} one {# ration} other {# rations}} left."
