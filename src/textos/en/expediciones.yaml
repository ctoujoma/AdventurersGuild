  llegada: "{n, plural, one {Arrives} other {They arrive}} at the tavern."
  prudencia: "{guardian, select, si {No one says a word: they fight on their own.} other {No one says a word: {n, plural, one {plays it safe} other {they play it safe}}.}}"
