rumbos:
  bosque:
    nombre: "the forest"
    titulo: "Forest"
    desc: "To the east, oaks and beeches that grow ever thicker. Brings {materiales}; wolves, bears and poachers."
  sierra:
    nombre: "the mountains"
    titulo: "Mountains"
    desc: "To the north, snow and scree. Brings {materiales}."
  marismas:
    nombre: "the marshes"
    titulo: "Marshes"
    desc: "To the southwest, fog and reed beds. Brings {materiales}."
  ruinas:
    nombre: "the ruins"
    titulo: "Ruins"
    desc: "To the southeast, old stones and dust. Brings {materiales}."
