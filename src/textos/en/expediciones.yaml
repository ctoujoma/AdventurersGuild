    raciones: "Just enough rations left to get back ({raciones}): {n, plural, one {turns} other {they turn}} back."
    jugador: "Your message reaches {n, plural, one {them} other {them}}: heading home."
    herido: "With {heroe} {sexo, select, f {badly hurt} other {badly hurt}}, they turn back."
    caidos: "{n, plural, one {{heroe} crawls home as best they can} other {No one is left standing. They crawl home as best they can}}; most of the pack stays behind."
    hambre: "Out of rations, {n, plural, one {heads} other {they head}} home."
  camino:
    bosque:
      - "The trail gets lost among old oaks."
      - "{heroe} swears something is following {n, plural, one {them} other {them}} through the ferns."
      - "A deer crosses the trail and stands there staring."
      - "{heroe} finds mushrooms; better not to try them."
      - "{heroe} notches the trunks with a knife so as not to get lost."
      - "Rain drips through the leaves; {n, plural, one {keeps} other {they keep}} going anyway, {n, plural, one {{sexo, select, f {soaked} other {soaked}}} other {soaked}}."
      - "A crow follows {n, plural, one {them} other {them}} a long way, from branch to branch."
      - "{n, plural, one {Crosses} other {They cross}} a freezing stream on a fallen log."
