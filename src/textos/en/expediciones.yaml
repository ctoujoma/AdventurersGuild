rumbos:
  bosque:
    nombre: "the forest"
    titulo: "Forest"
    desc: "To the east, oaks and beeches that grow ever thicker. Brings {materiales}; wolves, bears and poachers."
  sierra:
    nombre: "the mountains"
    titulo: "Mountains"
    desc: "To the north, snow and scree. Brings {materiales}; wolves, mine goblins and blizzards."
  marismas:
    nombre: "the marshes"
    titulo: "Marshes"
    desc: "To the southwest, fog and reed beds. Brings {materiales}; leeches, drowned ones and smugglers."
  ruinas:
    nombre: "the ruins"
    titulo: "Ruins"
    desc: "To the southeast, old stones and dust. Brings {materiales}; skeletons, looters and traps."
