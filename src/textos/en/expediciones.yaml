  pelea_bien: "{n, plural, one {{heroe} runs into {enemigos} and comes out fine} other {They run into {enemigos}; {heroe} stands up to them and they come out fine}}.{oro, plural, =0 {} other { Afterwards {n, plural, one {picks} other {they pick}} up {oro} coins from the ground.}}"
