  tras_pelea: "After the fight, they find {que}."
  guardian_botin: "In its lair they find {que}. And something else: {objeto}."
  vuelta:
    raciones: "Just enough rations left to get back ({raciones}): {n, plural, one {turns} other {they turn}} back."
    jugador: "Your message reaches {n, plural, one {them} other {them}}: heading home."
    herido: "With {heroe} {sexo, select, f {badly hurt} other {badly hurt}}, they turn back."
    caidos: "{n, plural, one {{heroe} crawls home as best they can} other {No one is left standing. They crawl home as best they can}}; most of the pack stays behind."
    hambre: "Out of rations, {n, plural, one {heads} other {they head}} home."
    guardian: "Better not to push their luck: {n, plural, one {turns} other {they turn}} back."
  camino:
    bosque:
      - "The trail gets lost among old oaks."
      - "{heroe} swears something is following {n, plural, one {them} other {them}} through the ferns."
      - "A deer crosses the trail and stands there staring."
      - "{heroe} finds mushrooms; better not to try them."
      - "{heroe} notches the trunks with a knife so as not to get lost."
      - "Rain drips through the leaves; {n, plural, one {keeps} other {they keep}} going anyway, {n, plural, one {{sexo, select, f {soaked} other {soaked}}} other {soaked}}."
      - "A crow follows {n, plural, one {them} other {them}} a long way, from branch to branch."
      - "{n, plural, one {Crosses} other {They cross}} a freezing stream on a fallen log."
    sierra:
      - "The path turns to scree; {n, plural, one {climbs} other {they climb}} carefully."
      - "{heroe} points at huge tracks in the snow."
      - "An eagle circles high above."
      - "{n, plural, one {Finds} other {They find}} the mouth of an abandoned mine; better not go in blind."
      - "The wind whistles between the crags."
      - "{heroe} slips on the ice, but nothing comes of it."
    marismas:
      - "The water comes up to their knees."
      - "{heroe} pulls a leech off an arm."
      - "The frogs fall silent as they pass."
      - "A heron takes off from the reeds."
      - "{n, plural, one {Follows} other {They follow}} a path of half-rotten boards."
      - "It smells of mud and rain."
    ruinas:
      - "Broken columns poke out of the sand."
      - "{heroe} finds an old coin with a face nobody knows."
      - "A lizard suns itself on a headless statue."
      - "{heroe} steps on a slab that sounds hollow; better go around."
      - "What's left of a mosaic: a dragon, or so it seems."
      - "The dust rises in whirls."
  noche:
    bosque: "{n, plural, one {Camps} other {They camp}} under the trees{vuelta, select, si {, on the way back} other {}}. {raciones, plural, =0 {No rations} one {# ration} other {# rations}} left."
    sierra: "{n, plural, one {Camps} other {They camp}} in the lee of a crag{vuelta, select, si {, on the way back} other {}}. {raciones, plural, =0 {No rations} one {# ration} other {# rations}} left."
    marismas: "{n, plural, one {Camps} other {They camp}} on a dry islet{vuelta, select, si {, on the way back} other {}}. {raciones, plural, =0 {No rations} one {# ration} other {# rations}} left."
    ruinas: "{n, plural, one {Camps} other {They camp}} among old walls{vuelta, select, si {, on the way back} other {}}. {raciones, plural, =0 {No rations} one {# ration} other {# rations}} left."
  nieve: "The snow bites: they burn {m, plural, one {one more ration} other {# more rations}} to keep warm."
  tiempo:
    claro: "It clears up: the day turns bright."
    lluvia: "It starts to rain: the path turns to mud and they slow down."
    niebla: "Fog rolls in: you can't see ten paces ahead."
    nieve: "It starts to snow."
    viento: "An icy wind picks up and holds them back."
    polvo: "The wind raises dust: it's hard to see what lies ahead."
    tormenta: "A dry storm rolls in: lightning without rain and dust everywhere."
