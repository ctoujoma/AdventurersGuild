  sin_oro: "The pack doesn't hold {n} coins."
  sin_materiales: "They carry nothing to sell."
diario:
  record: "They have gone further into {rumbo, select, bosque {the forest} sierra {the mountains} marismas {the marshes} other {the ruins}} than anyone from the guild: a new record."
  fardo_queda: "What they can't carry is left behind in a bundle; maybe another expedition will find it."
  fardo: "A guild bundle! It's the one {quien} lost: {que}."
  paraje_visto: "They pass by {que}; the guild already went in there on day {dia}."
  paraje_otra_vez: "They come across {que}, which the guild saw on day {dia} and left unexplored."
  salida: "{grupo} {n, plural, one {sets} other {set}} out for {rumbo, select, bosque {the forest} sierra {the mountains} marismas {the marshes} other {the ruins}} with {raciones} rations."
