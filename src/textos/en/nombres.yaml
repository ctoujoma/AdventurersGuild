citas:
  guerrero:
    - "“Who needs hitting?”"
    - "“I bring a shield, a sword and the will. Leave the thinking to someone else.”"
    - "“I've survived three wars and a marriage.”"
    - "“I charge per blow. Just kidding. Sort of.”"
  picaro:
    - "“Locks talk to me. Especially after the third jug.”"
    - "“I don't ask where the gold comes from. Don't you ask either.”"
    - "“That purse you're looking for… was it red? What a coincidence.”"
    - "“I work nights. And days, if I need to hide.”"
  mago:
    - "“I charge up front. And don't call me a witch.”"
    - "“My thing is defensive magic. Mostly defending myself.”"
    - "“I read runes, stars and contracts. Contracts are the scariest.”"
    - "“If you see green smoke, step back. If you see purple smoke, run.”"
  clerigo:
    - "“I pray for everyone. For some, it costs more.”"
    - "“I've closed worse wounds than yours. And mouths.”"
    - "“The gods listen to me. Sometimes they answer.”"
    - "“I bring bandages and ointment. Patience, I'm short on.”"
  explorador:
    - "“The bad-luck thing is just rumours. Mostly.”"
    - "“I know a shortcut. Well, I know someone who knows it.”"
    - "“I sleep better under a tree than under your roof. No offence.”"
    - "“I smell rain two days ahead. And bandits, three.”"
