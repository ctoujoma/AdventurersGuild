ambiente:
  - "A bard has been singing off-key at the bar all morning. He's the smith's cousin, so nobody says anything."
  - "Someone has carved “Brom never misses” into a table. Below, in different handwriting, it says “sure, sure”."
  - "Whiskers has left something at the door that isn't a mouse. The innkeeper has covered it with a bucket."
  - "Today there's chunky soup. The innkeeper swears the chunks are bacon."
  - "A traveller asks if this is where they hire heroes “cheap, but not that cheap”."
  - "It rained all night. The leak in the cellar now has a name: Gertrude."
  - "The moneylender walked past the door, slowly, looking inside."
  - "Two regulars argue whether a griffin is more bird or more cat. There's already money on the table."
  - "The innkeeper swears Uncle Fausto's portrait winks at him at night."
  - "A kid came in to pet Whiskers. Left with a scratch and very happy."
