por_rasgo:
  velo:
    - "{heroe} stared at a roadside grave longer than they should. Says it waved at them."
    - "At night, by the fire, {heroe} doesn't talk about the other side. Nobody dares ask."
  valiente:
    - "{heroe} offered to go first without anyone asking."
    - "{heroe} laughed at danger, and danger left them a souvenir on the leg."
  cobarde:
    - "{heroe} suggested turning back three times “out of prudence”."
    - "Every time a branch creaked, {heroe} ended up behind someone."
  codicioso:
    - "{heroe} priced everything in sight, including the client's boots."
    - "{heroe} asked twice whether the pay was per head or per party."
  afortunado:
    - "{heroe} found a coin on the road. Then another. Then another."
    - "A stray arrow bounced off {heroe}'s buckle. Not a scratch."
  gafe:
    - "Since {heroe} joined the trip, two straps broke and three black cats crossed their path."
    - "It started raining just as {heroe} said “what a lovely day”."
  bebedor:
    - "{heroe} brought a wineskin “to disinfect wounds”. It arrived empty."
    - "{heroe}'s first question on reaching {lugar} was where the tavern was."
  leal:
    - "{heroe} didn't leave the party even to sleep."
    - "{heroe} carried a companion's pack without a word."
  arrogante:
    - "{heroe} explained to the whole party how to do their jobs. Several times."
    - "{heroe} made it clear that, in their opinion, this was beneath their talent."
  supersticioso:
    - "{heroe} refused to cross the bridge until they'd spat into the river three times."
    - "{heroe} hung garlic in the tent. Nobody slept well, but no vampire came either."
  tuerto:
    - "With the eyepatch, {heroe} only had to glare for people to step aside."
  cojo:
    - "{heroe} limped the whole way without a complaint. Well, with a few."
  cortado:
    - "{heroe} only had to smile for nobody to look for a fight."
camino:
