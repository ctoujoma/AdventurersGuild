  - "They slept at an inn where the soup was even worse than at The Broken Jug. They didn't think it possible."
  - "A shepherd showed them the way in exchange for listening to him sing. He sang badly and at length."
  - "The storm caught them in the open and they spent the night in a barn, with a very curious goat."
  - "At a crossroads, a sign said “{lugar}, one league”. It was three."
  - "They crossed paths with another band of adventurers. They nodded and nobody said where they were going."
  - "A boy followed them for two leagues asking if they were real heroes."
  - "They slept in the open. Someone snored all night and nobody admits to it."
