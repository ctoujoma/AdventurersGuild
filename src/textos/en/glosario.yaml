terminos:
  oro_y_proximo_pago:
    termino: "Gold and next payment"
    texto: "What's in the till. Next to the scroll at the top is what's due and on which day: Merlo's instalment plus the week's wages. If you can't cover it, the game is over."
  reputacion_y_rango:
    termino: "Reputation and rank"
    texto: "Goes up with well-done quests and down with failures. Each rank brings better-paid quests, better candidates and more customers in the tavern."
  riesgo_de_un_encargo:
    termino: "Quest risk"
    texto: "Piece of cake, Likely, Risky or Suicidal. It comes from comparing the party with the quest's danger; it changes depending on who you send."
  peligro:
    termino: "Danger"
    texto: "The skulls on the map (one to four) and the quest's colour, from green (low) to red (deadly). With “?” you don't know until you upgrade the map room."
  historias:
    termino: "Stories"
    texto: "Chained quests that arrive by letter. Each step opens the next; on the map the red thread joins the finished steps (✓) with the one left (number). If you leave one waiting, the county gets restless."
  jefes:
    termino: "Bosses"
    texto: "Some stories end against a boss. That night, at dawn, a notice appears to watch the fight; if you leave it for later, it stays in the report with “Watch the battle”."
  amenaza_de_la_comarca:
    termino: "County threat"
    texto: "Grows every night a story step waits on the board and drops if none is under way. When high, caravans get raided, fewer quests arrive and bandits come to the tavern."
  asaltos_y_chivatazos:
    termino: "Raids and tip-offs"
    texto: "From day 12, a gang may attack the tavern at night. With luck someone warns you first (the red flag at the top counts the nights). The fight goes room by room: those on guard (two at most) go out to the yard and raise the alarm; if they fall, the gang breaks down the door and goes for the treasure vault. Those asleep come running, and the door, the lock and the distance buy them time. Whatever the bandits carry is recovered if they fall before getting out."
  camara_del_tesoro:
    termino: "Treasure vault"
    texto: "Holds all the guild's gold; the bigger and better, the more fits. Whatever doesn't fit is lost (the gold at the top turns yellow when it's almost full). Its level is also the lock the bandits have to pick."
  moral:
    termino: "Morale"
    texto: "The will to work. Drops with journeys and failures, rises resting at the tavern. When very low, they perform worse and may leave any night."
  heridos_y_desaparecidos:
    termino: "Wounded and missing"
    texto: "The wounded heal in the infirmary. A missing hero got lost on a quest: they may come back alone (the chapel helps) or with a rescue quest."
  nivel_y_veteranos:
    termino: "Level and veterans"
    texto: "Experience raises the level, and the wage with it. From level 4 they are veterans: the veterans' wing gives them extra rest and they no longer desert."
  equipo:
    termino: "Gear"
    texto: "Some quests bring it (“+ item”). Give it from the chest or the hero's sheet. {rarezas, mayus}; the frame takes its colour. If the hero dies, the item is lost."
  trofeos:
    termino: "Trophies"
    texto: "A brilliant success on a dangerous quest leaves a trophy. Hung in the hall, it draws customers: gold every day."
  modo_libre:
    termino: "Free mode"
    texto: "With the debt settled the guild is yours and the game goes on. Other guilds bid for quests and pay less; wages are paid every 7 days, and two weeks without paying ends it all."
  fiesta_de_la_comarca:
    termino: "County festival"
    texto: "Every 10 days. If you host it at the tavern, that night the till doubles and those resting cheer up."
