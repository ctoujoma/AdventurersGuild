    da: "more gold in the till"
  cocina:
    nombre:
      m: "Cook"
      f: "Cook"
    trabajo: "Cooks"
    da: "the house's food"
  bodega:
    nombre:
      m: "Brewer"
      f: "Brewer"
    trabajo: "Brews beer"
    da: "beer for the hall"
  enfermeria:
    nombre:
      m: "Nurse"
      f: "Nurse"
    trabajo: "Tends the wounded"
    da: "the wounded heal sooner"
  forja:
    nombre:
      m: "Smith"
      f: "Smith"
    trabajo: "Works at the forge"
    da: "makes weapons and armour"
  sastreria:
    nombre:
      m: "Tailor"
      f: "Tailor"
    trabajo: "Sews at the tailor's"
    da: "dresses the heroes and makes boots and cloaks"
  alquimia:
    nombre:
      m: "Alchemist"
      f: "Alchemist"
    trabajo: "Works in the alchemy workshop"
